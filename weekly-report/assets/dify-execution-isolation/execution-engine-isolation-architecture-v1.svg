<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="930" viewBox="0 0 1600 930">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5b8def"/><stop offset="1" stop-color="#3567d8"/></linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b6df0"/><stop offset="1" stop-color="#6941c6"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#39b8d4"/><stop offset="1" stop-color="#1688a8"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4ecb8d"/><stop offset="1" stop-color="#249d68"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1d2939" flood-opacity=".14"/></filter>
    <style>
      .t{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;fill:#172033}.title{font-size:32px;font-weight:760}.sub{font-size:15px;fill:#667085}.h{font-size:20px;font-weight:700}.label{font-size:16px;font-weight:650}.small{font-size:13px;fill:#667085}.tiny{font-size:12px;fill:#667085}.white{fill:#fff}.stroke{stroke:#d0d5dd;stroke-width:1.4}.line{fill:none;stroke:#98a2b3;stroke-width:2}.blueLine{fill:none;stroke:#4f7fe5;stroke-width:3}.purpleLine{fill:none;stroke:#7a5bd8;stroke-width:3}
    </style>
    <marker id="arrB" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto"><path d="M0,0 L0,7 L10,3.5 z" fill="#4f7fe5"/></marker>
    <marker id="arrP" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto"><path d="M0,0 L0,7 L10,3.5 z" fill="#7a5bd8"/></marker>
    <marker id="arrG" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto"><path d="M0,0 L0,7 L10,3.5 z" fill="#98a2b3"/></marker>
  </defs>
  <rect width="1600" height="930" fill="url(#bg)"/>
  <text x="800" y="52" text-anchor="middle" class="t title">Dify 执行引擎隔离：轻量执行池路由</text>
  <text x="800" y="80" text-anchor="middle" class="t sub">只改变任务进入哪个 Queue / Worker Pool；进入 Worker 后继续执行同一套 Dify 1.17.1 官方逻辑</text>

  <!-- app cards -->
  <g filter="url(#shadow)">
    <rect x="155" y="125" width="360" height="126" rx="22" fill="#fff" class="stroke"/>
    <rect x="1085" y="125" width="360" height="126" rx="22" fill="#fff" class="stroke"/>
  </g>
  <rect x="185" y="152" width="70" height="70" rx="18" fill="#edf4ff"/>
  <rect x="1115" y="152" width="70" height="70" rx="18" fill="#f4f0ff"/>
  <path d="M202 170h36v27h-36zM202 177h36" fill="none" stroke="#3567d8" stroke-width="2.5"/>
  <circle cx="208" cy="173.5" r="1.5" fill="#3567d8"/><circle cx="214" cy="173.5" r="1.5" fill="#3567d8"/>
  <path d="M1132 170h36v27h-36zM1132 177h36" fill="none" stroke="#6941c6" stroke-width="2.5"/>
  <circle cx="1138" cy="173.5" r="1.5" fill="#6941c6"/><circle cx="1144" cy="173.5" r="1.5" fill="#6941c6"/>
  <text x="277" y="174" class="t h">普通应用</text><text x="277" y="201" class="t small">execution_pool = default</text><text x="277" y="224" class="t tiny">沿用官方默认执行路径</text>
  <text x="1207" y="174" class="t h">核心应用</text><text x="1207" y="201" class="t small">execution_pool = priority</text><text x="1207" y="224" class="t tiny">进入独立执行资源池</text>

  <!-- router chip -->
  <g filter="url(#shadow)">
    <path d="M675 126h250l55 62-55 62H675l-55-62z" fill="#fff" stroke="#b9c5da" stroke-width="1.6"/>
  </g>
  <rect x="703" y="151" width="64" height="64" rx="15" fill="url(#cyan)"/>
  <path d="M719 170h32M719 182h22M719 194h28" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <text x="790" y="172" class="t h">Execution Queue Router</text>
  <text x="790" y="199" class="t small">读取 App 的 execution_pool</text>
  <text x="790" y="220" class="t tiny">只负责选择目标 Queue</text>

  <path d="M515 188H620" class="blueLine" marker-end="url(#arrB)"/>
  <path d="M1085 188H980" class="purpleLine" marker-end="url(#arrP)"/>

  <!-- split -->
  <path d="M745 250V302H402V340" class="blueLine" marker-end="url(#arrB)"/>
  <path d="M855 250V302H1198V340" class="purpleLine" marker-end="url(#arrP)"/>

  <!-- queue cylinders -->
  <g filter="url(#shadow)">
    <ellipse cx="402" cy="372" rx="145" ry="32" fill="#dce9ff" stroke="#7aa2ee" stroke-width="1.5"/>
    <rect x="257" y="372" width="290" height="78" fill="#eaf2ff" stroke="#7aa2ee" stroke-width="1.5"/>
    <ellipse cx="402" cy="450" rx="145" ry="32" fill="#cfe0ff" stroke="#7aa2ee" stroke-width="1.5"/>
    <ellipse cx="1198" cy="372" rx="145" ry="32" fill="#e9e1ff" stroke="#9c84eb" stroke-width="1.5"/>
    <rect x="1053" y="372" width="290" height="78" fill="#f1edff" stroke="#9c84eb" stroke-width="1.5"/>
    <ellipse cx="1198" cy="450" rx="145" ry="32" fill="#dfd4ff" stroke="#9c84eb" stroke-width="1.5"/>
  </g>
  <text x="402" y="385" text-anchor="middle" class="t label">Default Queue</text>
  <text x="402" y="418" text-anchor="middle" class="t small">workflow_based_app_execution</text>
  <text x="1198" y="385" text-anchor="middle" class="t label">Priority Queue</text>
  <text x="1198" y="418" text-anchor="middle" class="t small">workflow_based_app_execution_priority</text>

  <!-- worker pool 3d servers -->
  <g filter="url(#shadow)">
    <path d="M245 555l70-36h220l70 36-70 36H315z" fill="#dce9ff" stroke="#739ce9" stroke-width="1.5"/>
    <path d="M245 555v92l70 36v-92z" fill="#c7dafe" stroke="#739ce9" stroke-width="1.5"/>
    <path d="M315 591h220v92H315z" fill="#f6f9ff" stroke="#739ce9" stroke-width="1.5"/>
    <path d="M995 555l70-36h220l70 36-70 36h-220z" fill="#eadfff" stroke="#8f73e1" stroke-width="1.5"/>
    <path d="M995 555v92l70 36v-92z" fill="#d7c7ff" stroke="#8f73e1" stroke-width="1.5"/>
    <path d="M1065 591h220v92h-220z" fill="#faf8ff" stroke="#8f73e1" stroke-width="1.5"/>
  </g>
  <rect x="342" y="611" width="166" height="18" rx="6" fill="#dbe7ff"/><circle cx="490" cy="620" r="4" fill="#3567d8"/>
  <rect x="342" y="641" width="166" height="18" rx="6" fill="#dbe7ff"/><circle cx="490" cy="650" r="4" fill="#3567d8"/>
  <rect x="1092" y="611" width="166" height="18" rx="6" fill="#e6dcff"/><circle cx="1240" cy="620" r="4" fill="#6941c6"/>
  <rect x="1092" y="641" width="166" height="18" rx="6" fill="#e6dcff"/><circle cx="1240" cy="650" r="4" fill="#6941c6"/>
  <text x="425" y="715" text-anchor="middle" class="t h">Default Worker Pool</text>
  <text x="425" y="739" text-anchor="middle" class="t small">现有 Worker 资源</text>
  <text x="1175" y="715" text-anchor="middle" class="t h">Priority Worker Pool</text>
  <text x="1175" y="739" text-anchor="middle" class="t small">独立 Pod / CPU / Memory</text>
  <path d="M402 482V520" class="blueLine" marker-end="url(#arrB)"/>
  <path d="M1198 482V520" class="purpleLine" marker-end="url(#arrP)"/>

  <!-- shared runtime -->
  <g filter="url(#shadow)">
    <path d="M510 774l105-42h370l105 42-105 42H615z" fill="#c9f0df" stroke="#52b788" stroke-width="1.6"/>
    <path d="M510 774v54l105 42v-54z" fill="#aee4ce" stroke="#52b788" stroke-width="1.6"/>
    <path d="M615 816h370v54H615z" fill="#effcf7" stroke="#52b788" stroke-width="1.6"/>
  </g>
  <circle cx="690" cy="785" r="24" fill="url(#green)"/><path d="M679 785h22M690 774v22" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <text x="730" y="780" class="t h">Dify 1.17.1 官方执行链路</text>
  <text x="730" y="806" class="t small">workflow_based_app_execution_task → AppGenerator → GraphEngine → SSE / Result</text>
  <text x="800" y="852" text-anchor="middle" class="t tiny">两组 Worker 使用同一份代码、同一套任务语义；差异仅在执行资源</text>
  <path d="M535 680C600 730 640 735 675 749" class="line" marker-end="url(#arrG)"/>
  <path d="M1065 680C1000 730 960 735 925 749" class="line" marker-end="url(#arrG)"/>

  <!-- infra chips -->
  <rect x="1340" y="790" width="195" height="76" rx="18" fill="#fff" stroke="#d0d5dd"/>
  <ellipse cx="1374" cy="817" rx="18" ry="7" fill="#eef2f6" stroke="#667085"/><path d="M1356 817v22c0 4 8 7 18 7s18-3 18-7v-22" fill="#f8fafc" stroke="#667085"/>
  <text x="1405" y="817" class="t label">共享基础设施</text><text x="1405" y="841" class="t tiny">Redis / PostgreSQL / Plugin</text>
</svg>