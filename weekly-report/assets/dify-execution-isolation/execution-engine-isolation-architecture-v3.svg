<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-label="分池执行，结果返回 API：客户端请求由 Dify API 按应用配置分流到普通或核心队列和 Worker，执行结果经事件通道或结果存储返回 API">
<defs>
  <filter id="shadow" x="-18%" y="-28%" width="136%" height="160%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#324B65" flood-opacity=".11"/></filter>
  <marker id="taskArrow" viewBox="0 0 11 11" markerWidth="10" markerHeight="10" refX="9.2" refY="5.5" orient="auto"><path d="M1 1L9.5 5.5L1 10Z" fill="#597B9D"/></marker>
  <marker id="resultArrow" viewBox="0 0 11 11" markerWidth="10" markerHeight="10" refX="9.2" refY="5.5" orient="auto"><path d="M1 1L9.5 5.5L1 10Z" fill="#9272BC"/></marker>
  <style>
    text { font-family: Inter,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#243B50; }
    .title{font-size:38px;font-weight:750;letter-spacing:.5px}
    .big{font-size:32px;font-weight:730}
    .node{font-size:29px;font-weight:720}
    .label{font-size:25px;font-weight:700}
    .desc{font-size:25px;font-weight:550;fill:#667E94}
    .hint{font-size:23px;font-weight:560;fill:#697F95}
    .lane{font-size:24px;font-weight:660;fill:#6A8095}
    .resultTitle{font-size:31px;font-weight:700;fill:#9272BC}
    .legend{font-size:24px;font-weight:550;fill:#667F94}
    .task{stroke:#597B9D;stroke-width:3;fill:none;stroke-linejoin:round;marker-end:url(#taskArrow)}
    .result{stroke:#9272BC;stroke-width:3;fill:none;stroke-linejoin:round;marker-end:url(#resultArrow)}
    .config{stroke:#597B9D;stroke-width:2.8;fill:none;stroke-dasharray:7 8;marker-end:url(#taskArrow)}
  </style>
  <symbol id="client" viewBox="0 0 56 56">
    <rect x="6" y="6" width="44" height="32" rx="4" fill="none" stroke="#66809A" stroke-width="2.8"/>
    <path d="M28 38v11M15 49h26" stroke="#66809A" stroke-width="2.8" stroke-linecap="round"/>
  </symbol>
</defs>
<rect width="1600" height="960" fill="#FFFFFF"/>
<text x="54" y="60" class="title">分池执行，结果返回 API</text>

<!-- Lane backplates -->
<rect x="740" y="101" width="723" height="247" rx="23" fill="#FAFBFC" stroke="#DEE6EE" stroke-width="1.8" />
<rect x="740" y="361" width="723" height="238" rx="23" fill="#FAFBFC" stroke="#DEE6EE" stroke-width="1.8" />
<text x="771" y="143" class="lane">普通执行池</text>
<text x="771" y="399" class="lane">核心执行池</text>

<!-- Task paths, drawn behind components -->
<path d="M239 376H330" class="task"/>
<path d="M607 333H669V231H765" class="task"/>
<path d="M607 381H692V491H765" class="task"/>
<path d="M1014 231H1112" class="task"/>
<path d="M1014 490H1112" class="task"/>
<path d="M472 219V271" class="config"/>

<!-- Results paths -->
<path d="M1430 251H1482V734H1468" class="result"/>
<path d="M1430 511H1482" class="result"/>
<path d="M740 734H473V483" class="result"/>
<path d="M339 424H252" class="result"/>
<!-- API result loop lower nodes -->
<text x="1045" y="644" class="resultTitle">结果回传</text>
<rect x="740" y="671" width="723" height="123" rx="22" fill="#FAF7FE" stroke="#D6C6EC" stroke-width="1.8" />
<rect x="765" y="694" width="322" height="71" rx="13" fill="#F0F4F9" stroke="#9AAEC7" stroke-width="1.9" />
<rect x="1117" y="694" width="321" height="71" rx="13" fill="#EAF7F4" stroke="#319B90" stroke-width="1.9" />
<text x="926" y="739" class="desc" text-anchor="middle">流式：事件通道</text>
<text x="1278" y="739" class="desc" text-anchor="middle">阻塞：结果存储</text>
<text x="514" y="707" class="hint">结果回到 API</text>
<text x="260" y="318" class="hint">请求</text>
<text x="259" y="414" class="hint">响应</text>

<!-- Client -->
<rect x="53" y="298" width="187" height="158" rx="19" fill="#F4F7FA" stroke="#DCE4ED" stroke-width="1.9" filter="url(#shadow)"/>
<use href="#client" x="122" y="314" width="54" height="54"/>
<text x="146" y="420" class="node" text-anchor="middle">客户端</text>

<!-- Config -->
<rect x="339" y="101" width="268" height="118" rx="19" fill="#E9F2FF" stroke="#5588E2" stroke-width="2.2" />
<text x="473" y="154" class="node" text-anchor="middle">应用执行池</text>
<text x="473" y="198" class="hint" text-anchor="middle">配置与管理入口</text>

<!-- API -->
<rect x="339" y="282" width="268" height="191" rx="20" fill="#FFF8ED" stroke="#E5AD4B" stroke-width="2.3" filter="url(#shadow)"/>
<text x="473" y="341" class="big" text-anchor="middle">Dify API</text>
<text x="473" y="393" class="desc" text-anchor="middle">任务分流</text>
<text x="473" y="443" class="desc" text-anchor="middle">结果接收</text>

<!-- Default Queue/Worker -->
<rect x="776" y="179" width="238" height="107" rx="17" fill="#F0F4F8" stroke="#9BAFC8" stroke-width="2" />
<text x="895" y="247" class="node" text-anchor="middle">普通队列</text>
<rect x="1123" y="166" width="307" height="145" rx="17" fill="#F0F4F8" stroke="#9BAFC8" stroke-width="2.2" filter="url(#shadow)"/>
<text x="1276" y="224" class="node" text-anchor="middle">普通 Worker</text>
<rect x="1148" y="242" width="258" height="49" rx="10" fill="#F5F7FA" stroke="#9BAFC8" stroke-width="1.9" />
<text x="1277" y="278" class="desc" text-anchor="middle">官方执行引擎</text>

<!-- Priority Queue/Worker -->
<rect x="776" y="439" width="238" height="107" rx="17" fill="#E8F1FE" stroke="#4A84E6" stroke-width="2.2" />
<text x="895" y="507" class="node" text-anchor="middle">核心队列</text>
<rect x="1123" y="427" width="307" height="145" rx="17" fill="#E8F1FE" stroke="#4A84E6" stroke-width="2.2" filter="url(#shadow)"/>
<text x="1276" y="485" class="node" text-anchor="middle">核心 Worker</text>
<rect x="1148" y="503" width="258" height="49" rx="10" fill="#F5F7FA" stroke="#9BAFC8" stroke-width="1.9" />
<text x="1277" y="539" class="desc" text-anchor="middle">官方执行引擎</text>

<!-- Footer legend -->
<path d="M54 814H1457" stroke="#E1E8EF" stroke-width="1.5"/>
<rect x="54" y="844" width="30" height="26" rx="5" fill="#F0F4F8" stroke="#9BAFC8" stroke-width="1.5" /><text x="98" y="865" class="legend">已有复用</text>
<rect x="362" y="844" width="30" height="26" rx="5" fill="#FFF8ED" stroke="#E5AD4B" stroke-width="1.5" /><text x="406" y="865" class="legend">本次扩展</text>
<rect x="668" y="844" width="30" height="26" rx="5" fill="#EAF7F4" stroke="#319B90" stroke-width="1.5" /><text x="712" y="865" class="legend">已有能力接入</text>
<rect x="1038" y="844" width="30" height="26" rx="5" fill="#E8F1FE" stroke="#4A84E6" stroke-width="1.5" /><text x="1082" y="865" class="legend">本次新增</text>
<path d="M54 917H99" class="task"/><text x="115" y="925" class="legend">任务</text>
<path d="M361 917H406" class="result"/><text x="422" y="925" class="legend">结果</text>
<path d="M664 917H709" class="config"/><text x="725" y="925" class="legend">配置</text>
</svg>