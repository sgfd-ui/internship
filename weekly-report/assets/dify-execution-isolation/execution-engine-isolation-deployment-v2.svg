<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8FAFC"/><stop offset="1" stop-color="#F5F3FF"/></linearGradient>
    <linearGradient id="b2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5B8DEF"/><stop offset="1" stop-color="#3567D8"/></linearGradient>
    <linearGradient id="v2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8B6DF0"/><stop offset="1" stop-color="#6941C6"/></linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#101828" flood-opacity=".12"/></filter>
    <style>
      .t{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;fill:#172033}
      .title{font-size:32px;font-weight:700}.sub{font-size:15px;fill:#667085}
      .h{font-size:21px;font-weight:700}.label{font-size:16px;font-weight:600}
      .small{font-size:13px;fill:#667085}.tiny{font-size:12px;fill:#667085}
      .panel{fill:#fff;stroke:#D0D5DD;stroke-width:1.4}
      .line{fill:none;stroke:#98A2B3;stroke-width:2.2}.blue{fill:none;stroke:#4F7FE5;stroke-width:3}.violet{fill:none;stroke:#7A5BD8;stroke-width:3}
    </style>
    <marker id="ab2" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto"><path d="M0 0L0 7L10 3.5z" fill="#4F7FE5"/></marker>
    <marker id="av2" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto"><path d="M0 0L0 7L10 3.5z" fill="#7A5BD8"/></marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg2)"/>
  <text x="800" y="50" text-anchor="middle" class="t title">Dify 执行引擎隔离部署架构</text>
  <text x="800" y="78" text-anchor="middle" class="t sub">共享基础设施不拆分；新增独立 Priority Worker Deployment 实现计算资源隔离</text>

  <!-- shared layer -->
  <g filter="url(#sh)">
    <rect x="100" y="125" width="1400" height="175" rx="26" class="panel"/>
  </g>
  <text x="135" y="163" class="t h">共享运行组件</text>

  <g transform="translate(145,195)">
    <rect width="220" height="70" rx="18" fill="#EEF4FF"/>
    <circle cx="36" cy="35" r="18" fill="url(#b2)"/>
    <path d="M27 35h18M36 26v18" stroke="#fff" stroke-width="2.6"/>
    <text x="68" y="31" class="t label">Dify API / Web</text>
    <text x="68" y="51" class="t tiny">统一请求入口</text>
  </g>

  <g transform="translate(405,195)">
    <rect width="220" height="70" rx="18" fill="#ECFDF3"/>
    <ellipse cx="36" cy="29" rx="16" ry="7" fill="none" stroke="#249D68" stroke-width="2"/>
    <path d="M20 29v17c0 5 7 8 16 8s16-3 16-8V29" fill="none" stroke="#249D68" stroke-width="2"/>
    <text x="68" y="31" class="t label">PostgreSQL</text>
    <text x="68" y="51" class="t tiny">App 执行池配置</text>
  </g>

  <g transform="translate(665,195)">
    <rect width="220" height="70" rx="18" fill="#FFF7ED"/>
    <rect x="20" y="20" width="32" height="32" rx="8" fill="#F79009"/>
    <path d="M28 36h16" stroke="#fff" stroke-width="2.6"/>
    <text x="68" y="31" class="t label">Redis / Celery</text>
    <text x="68" y="51" class="t tiny">共享 Broker</text>
  </g>

  <g transform="translate(925,195)">
    <rect width="220" height="70" rx="18" fill="#F4F0FF"/>
    <path d="M36 18l17 9v18l-17 9-17-9V27z" fill="url(#v2)"/>
    <text x="68" y="31" class="t label">Plugin Daemon</text>
    <text x="68" y="51" class="t tiny">保持共享</text>
  </g>

  <g transform="translate(1185,195)">
    <rect width="220" height="70" rx="18" fill="#F2F4F7"/>
    <path d="M21 21h31v28H21zM21 29h31" fill="none" stroke="#667085" stroke-width="2"/>
    <text x="68" y="31" class="t label">Sandbox</text>
    <text x="68" y="51" class="t tiny">保持共享</text>
  </g>

  <!-- queues -->
  <g filter="url(#sh)">
    <ellipse cx="430" cy="405" rx="180" ry="28" fill="#DCE9FF" stroke="#7AA2EE" stroke-width="1.5"/>
    <rect x="250" y="405" width="360" height="58" fill="#EAF2FF" stroke="#7AA2EE" stroke-width="1.5"/>
    <ellipse cx="430" cy="463" rx="180" ry="28" fill="#CFE0FF" stroke="#7AA2EE" stroke-width="1.5"/>

    <ellipse cx="1170" cy="405" rx="180" ry="28" fill="#E9E1FF" stroke="#9C84EB" stroke-width="1.5"/>
    <rect x="990" y="405" width="360" height="58" fill="#F1EDFF" stroke="#9C84EB" stroke-width="1.5"/>
    <ellipse cx="1170" cy="463" rx="180" ry="28" fill="#DFD4FF" stroke="#9C84EB" stroke-width="1.5"/>
  </g>

  <text x="430" y="414" text-anchor="middle" class="t label">Default Queue</text>
  <text x="430" y="445" text-anchor="middle" class="t tiny">workflow_based_app_execution</text>
  <text x="1170" y="414" text-anchor="middle" class="t label">Priority Queue</text>
  <text x="1170" y="445" text-anchor="middle" class="t tiny">workflow_based_app_execution_priority</text>

  <path d="M735 300C650 340 560 360 485 375" class="blue" marker-end="url(#ab2)"/>
  <path d="M865 300C950 340 1040 360 1115 375" class="violet" marker-end="url(#av2)"/>

  <!-- deployment cards -->
  <g filter="url(#sh)">
    <rect x="150" y="555" width="560" height="245" rx="28" class="panel"/>
    <rect x="890" y="555" width="560" height="245" rx="28" class="panel"/>
  </g>

  <rect x="185" y="590" width="120" height="120" rx="22" fill="#EDF4FF"/>
  <path d="M205 624l40-20 40 20-40 20z" fill="#DCE9FF" stroke="#3567D8" stroke-width="1.5"/>
  <path d="M205 624v46l40 20v-46z" fill="#C7DAFE" stroke="#3567D8" stroke-width="1.5"/>
  <path d="M245 644l40-20v46l-40 20z" fill="#F7FAFF" stroke="#3567D8" stroke-width="1.5"/>
  <text x="335" y="608" class="t h">Default Worker Deployment</text>
  <text x="335" y="642" class="t small">沿用现有 Worker 部署</text>
  <text x="335" y="672" class="t label">监听：Default Queue + 原有其他 Queue</text>
  <text x="335" y="705" class="t small">CPU / Memory / replicas 使用现有配置</text>
  <text x="335" y="735" class="t tiny">不监听 Priority Queue</text>

  <rect x="925" y="590" width="120" height="120" rx="22" fill="#F4F0FF"/>
  <path d="M945 624l40-20 40 20-40 20z" fill="#EADFFF" stroke="#6941C6" stroke-width="1.5"/>
  <path d="M945 624v46l40 20v-46z" fill="#D7C7FF" stroke="#6941C6" stroke-width="1.5"/>
  <path d="M985 644l40-20v46l-40 20z" fill="#FBF9FF" stroke="#6941C6" stroke-width="1.5"/>
  <text x="1075" y="608" class="t h">Priority Worker Deployment</text>
  <text x="1075" y="642" class="t small">新增独立 Worker 部署</text>
  <text x="1075" y="672" class="t label">监听：Priority Queue</text>
  <text x="1075" y="705" class="t small">独立 CPU / Memory / replicas</text>
  <text x="1075" y="735" class="t tiny">与普通任务不竞争 Worker 计算资源</text>

  <path d="M430 492V545" class="blue" marker-end="url(#ab2)"/>
  <path d="M1170 492V545" class="violet" marker-end="url(#av2)"/>

  <text x="800" y="850" text-anchor="middle" class="t small">两组 Worker 使用同一份 Dify 1.17.1 后端制品，仅部署角色与监听 Queue 不同</text>
</svg>