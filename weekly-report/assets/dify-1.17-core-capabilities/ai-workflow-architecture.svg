<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="520" viewBox="0 0 1300 520">
<style>.t{font-family:Arial,'Noto Sans SC',sans-serif;fill:#172033}.h{font-size:24px;font-weight:700}.m{font-size:17px;font-weight:700}.s{font-size:13px;fill:#626c7d}.box{fill:#fff;stroke:#d8deea;stroke-width:2}.a{fill:#eef3ff;stroke:#9bb4f0;stroke-width:2}.line{stroke:#8995a8;stroke-width:2;fill:none;marker-end:url(#ar)}</style><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#8995a8"/></marker></defs>
<rect width="1300" height="520" rx="24" fill="#fafbfc"/><text x="650" y="45" text-anchor="middle" class="t h">AI Workflow 生成架构</text>
<rect x="50" y="180" width="175" height="95" rx="16" class="box"/><text x="137" y="220" text-anchor="middle" class="t m">Natural Language</text><text x="137" y="246" text-anchor="middle" class="t s">Create / Refine</text>
<rect x="285" y="150" width="190" height="155" rx="18" class="a"/><text x="380" y="195" text-anchor="middle" class="t m">Planner</text><text x="380" y="225" text-anchor="middle" class="t s">理解需求</text><text x="380" y="248" text-anchor="middle" class="t s">规划 Nodes / Edges</text>
<rect x="535" y="120" width="205" height="215" rx="18" class="box"/><text x="637" y="165" text-anchor="middle" class="t m">Node Builders</text><text x="637" y="198" text-anchor="middle" class="t s">并行生成节点配置</text><rect x="570" y="225" width="135" height="52" rx="10" class="a"/><text x="637" y="256" text-anchor="middle" class="t s">Tool Context</text>
<rect x="800" y="150" width="190" height="155" rx="18" class="box"/><text x="895" y="195" text-anchor="middle" class="t m">Postprocess</text><text x="895" y="225" text-anchor="middle" class="t s">组装 Graph</text><text x="895" y="248" text-anchor="middle" class="t s">Auto Layout / Validate</text>
<rect x="1050" y="180" width="195" height="95" rx="16" class="a"/><text x="1147" y="220" text-anchor="middle" class="t m">Workflow Graph</text><text x="1147" y="246" text-anchor="middle" class="t s">Nodes · Edges · Viewport</text>
<path d="M225 227 H285" class="line"/><path d="M475 227 H535" class="line"/><path d="M740 227 H800" class="line"/><path d="M990 227 H1050" class="line"/>
<text x="650" y="405" text-anchor="middle" class="t s">Planner 负责结构规划，Node Builders 负责节点语义配置，Postprocess 负责组装、布局与校验</text>
</svg>