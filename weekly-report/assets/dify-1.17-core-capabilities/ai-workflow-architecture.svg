<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="650" viewBox="0 0 1500 650">
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8Z" fill="#7f8da3"/></marker>
  <style>
    .t{font-family:Arial,'Noto Sans SC',sans-serif;fill:#172033}
    .title{font-size:30px;font-weight:700}
    .h{font-size:21px;font-weight:700}
    .m{font-size:16px;font-weight:700}
    .s{font-size:13px;fill:#667085}
    .panel{fill:#fff;stroke:#d7deea;stroke-width:2}
    .blue{fill:#eef4ff;stroke:#9eb7ef;stroke-width:2}
    .soft{fill:#f7f8fa;stroke:#d7deea;stroke-width:2}
    .chip{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}
    .line{stroke:#7f8da3;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
    .dash{stroke:#a6b1c0;stroke-width:1.8;stroke-dasharray:7 6;fill:none;marker-end:url(#arrow)}
  </style>
</defs>

<rect width="1500" height="650" rx="28" fill="#fafbfc"/>
<text x="750" y="48" text-anchor="middle" class="t title">Dify AI Workflow 自然语言生成架构</text>

<!-- Context sources -->
<rect x="65" y="120" width="220" height="78" rx="18" class="panel"/>
<circle cx="105" cy="159" r="19" fill="#eef4ff" stroke="#9eb7ef"/>
<text x="105" y="165" text-anchor="middle" class="t m">U</text>
<text x="185" y="151" text-anchor="middle" class="t h">Instruction</text>
<text x="185" y="176" text-anchor="middle" class="t s">Create / Refine 请求</text>

<rect x="65" y="245" width="220" height="78" rx="18" class="soft"/>
<circle cx="105" cy="284" r="19" fill="#fff" stroke="#cbd5e1"/>
<text x="105" y="290" text-anchor="middle" class="t m">T</text>
<text x="185" y="276" text-anchor="middle" class="t h">Installed Tools</text>
<text x="185" y="301" text-anchor="middle" class="t s">Workspace Tool Catalogue</text>

<rect x="65" y="370" width="220" height="78" rx="18" class="soft"/>
<circle cx="105" cy="409" r="19" fill="#fff" stroke="#cbd5e1"/>
<text x="105" y="415" text-anchor="middle" class="t m">G</text>
<text x="185" y="401" text-anchor="middle" class="t h">Current Graph</text>
<text x="185" y="426" text-anchor="middle" class="t s">仅 Refine 提供</text>

<!-- Stage 1 -->
<rect x="350" y="180" width="230" height="220" rx="22" class="soft"/>
<circle cx="395" cy="225" r="21" fill="#fff" stroke="#cbd5e1"/>
<text x="395" y="232" text-anchor="middle" class="t m">1</text>
<text x="480" y="226" text-anchor="middle" class="t h">Context Prepare</text>
<rect x="392" y="265" width="145" height="42" rx="10" class="chip"/>
<text x="465" y="291" text-anchor="middle" class="t s">Tool Candidate</text>
<rect x="392" y="318" width="145" height="42" rx="10" class="chip"/>
<text x="465" y="344" text-anchor="middle" class="t s">Graph Summary</text>
<text x="465" y="382" text-anchor="middle" class="t s">整理 Planner 所需上下文</text>

<!-- Stage 2 -->
<rect x="640" y="150" width="245" height="280" rx="24" class="blue"/>
<circle cx="688" cy="198" r="22" fill="#fff" stroke="#9eb7ef"/>
<text x="688" y="205" text-anchor="middle" class="t m">2</text>
<text x="790" y="199" text-anchor="middle" class="t h">Planner</text>
<rect x="685" y="240" width="155" height="42" rx="10" class="chip"/>
<text x="762" y="266" text-anchor="middle" class="t s">Task Split</text>
<rect x="685" y="292" width="155" height="42" rx="10" class="chip"/>
<text x="762" y="318" text-anchor="middle" class="t s">Node / Tool Select</text>
<rect x="685" y="344" width="155" height="42" rx="10" class="chip"/>
<text x="762" y="370" text-anchor="middle" class="t s">Edge / Control Flow</text>
<text x="762" y="409" text-anchor="middle" class="t s">输出 Node / Edge Plan</text>

<!-- Stage 3 -->
<rect x="945" y="180" width="230" height="220" rx="22" class="panel"/>
<circle cx="990" cy="225" r="21" fill="#f2f4f7" stroke="#cbd5e1"/>
<text x="990" y="232" text-anchor="middle" class="t m">3</text>
<text x="1080" y="226" text-anchor="middle" class="t h">Node Builders</text>
<rect x="985" y="265" width="150" height="42" rx="10" class="chip"/>
<text x="1060" y="291" text-anchor="middle" class="t s">Parallel Build</text>
<rect x="985" y="318" width="150" height="42" rx="10" class="chip"/>
<text x="1060" y="344" text-anchor="middle" class="t s">Node Config</text>
<text x="1060" y="382" text-anchor="middle" class="t s">生成具体节点参数</text>

<!-- Stage 4 -->
<rect x="1235" y="180" width="210" height="220" rx="22" class="soft"/>
<circle cx="1278" cy="225" r="21" fill="#fff" stroke="#cbd5e1"/>
<text x="1278" y="232" text-anchor="middle" class="t m">4</text>
<text x="1360" y="226" text-anchor="middle" class="t h">Postprocess</text>
<text x="1340" y="274" text-anchor="middle" class="t s">Assemble</text>
<text x="1340" y="304" text-anchor="middle" class="t s">Defaults / Wrapper</text>
<text x="1340" y="334" text-anchor="middle" class="t s">Auto Layout</text>
<text x="1340" y="364" text-anchor="middle" class="t s">Validation</text>

<!-- Flow -->
<path d="M285 159 H320 V235 H350" class="line"/>
<path d="M285 284 H320 V285 H350" class="line"/>
<path d="M285 409 H320 V340 H350" class="dash"/>
<path d="M580 290 H640" class="line"/>
<path d="M885 290 H945" class="line"/>
<path d="M1175 290 H1235" class="line"/>

<!-- Output -->
<rect x="520" y="490" width="460" height="105" rx="20" class="blue"/>
<text x="750" y="530" text-anchor="middle" class="t h">Workflow Graph</text>
<text x="750" y="561" text-anchor="middle" class="t s">nodes · edges · viewport → Preview / Apply → Canvas</text>
<path d="M1340 400 V460 H750 V490" class="line"/>

<text x="750" y="625" text-anchor="middle" class="t s">Create：Instruction + Tool Context ｜ Refine：在相同 Pipeline 上额外加入 Current Graph Context</text>
</svg>