<text x="1028" y="145" class="h">研发使用</text><text x="1028" y="167" class="s">提升开发与迭代效率</text>
<g>
 <rect x="1028" y="195" width="190" height="68" rx="10" class="card"/><circle cx="1058" cy="229" r="11" fill="none" stroke="#f59e0b" stroke-width="3"/><path d="M1066 237l10 10" stroke="#f59e0b" stroke-width="3"/><text x="1090" y="225" class="m">调试定位</text><text x="1090" y="245" class="s">快速发现问题</text>
