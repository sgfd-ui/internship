 <rect x="354" y="407" width="202" height="88" rx="10" class="card"/><circle cx="390" cy="451" r="20" fill="#ece8ff"/><rect x="381" y="438" width="18" height="26" rx="3" fill="none" stroke="#5b4bd8" stroke-width="2.2"/><path d="M385 444h10M385 450h10M385 456h7" stroke="#5b4bd8" stroke-width="2"/><text x="420" y="443" class="m">Dify Monitoring</text><text x="420" y="464" class="s">平台原生接入</text>
</g>

