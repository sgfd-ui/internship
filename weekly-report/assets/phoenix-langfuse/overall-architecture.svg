</g>

<path d="M288 325h42" class="line"/><path d="M580 325h42" class="line"/><path d="M962 325h42" class="line"/>
<text x="640" y="588" text-anchor="middle" class="m">运行数据 → 统一采集 → Trace / Evaluation / Dataset / Experiment → 调试与迭代</text>
