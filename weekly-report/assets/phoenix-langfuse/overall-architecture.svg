<g>
 <rect x="648" y="322" width="135" height="78" rx="10" class="card"/><path d="M672 369l12-16 13 11 12-20" fill="none" stroke="#1d9f7a" stroke-width="3"/><circle cx="672" cy="369" r="4" fill="#1d9f7a"/><circle cx="684" cy="353" r="4" fill="#1d9f7a"/><circle cx="697" cy="364" r="4" fill="#1d9f7a"/><circle cx="709" cy="344" r="4" fill="#1d9f7a"/><text x="722" y="351" class="m">Trace</text><text x="722" y="372" class="s">链路追踪</text>
 <rect x="801" y="322" width="135" height="78" rx="10" class="card"/><rect x="821" y="341" width="25" height="25" rx="4" fill="none" stroke="#1d9f7a" stroke-width="2.5"/><path d="M827 353l5 5 9-11" fill="none" stroke="#1d9f7a" stroke-width="2.5"/><text x="852" y="351" class="m">Evaluation</text><text x="852" y="372" class="s">效果评估</text>
 <rect x="648" y="414" width="135" height="78" rx="10" class="card"/><ellipse cx="674" cy="440" rx="12" ry="5" fill="none" stroke="#1d9f7a" stroke-width="2.2"/><path d="M662 440v22c0 7 24 7 24 0v-22M662 451c0 7 24 7 24 0" fill="none" stroke="#1d9f7a" stroke-width="2.2"/><text x="700" y="443" class="m">Dataset</text><text x="700" y="464" class="s">测试集沉淀</text>
 <rect x="801" y="414" width="135" height="78" rx="10" class="card"/><path d="M822 438h24M828 438v10l-9 16h30l-9-16v-10" fill="none" stroke="#1d9f7a" stroke-width="2.2"/><text x="852" y="443" class="m">Experiment</text><text x="852" y="464" class="s">版本验证</text>
</g>

