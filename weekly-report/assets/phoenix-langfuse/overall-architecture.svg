<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620">
<defs>
  <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#7b8ba7"/></marker>
  <style>
    text{font-family:Arial,"Microsoft YaHei",sans-serif;fill:#172033}.title{font-size:24px;font-weight:700}.h{font-size:18px;font-weight:700}.m{font-size:14px}.s{font-size:12px;fill:#63708a}.panel{stroke-width:1.2}.card{fill:#fff;stroke:#d7dfeb;stroke-width:1}.line{stroke:#7b8ba7;stroke-width:2;fill:none;marker-end:url(#a)}
  </style>
</defs>
<rect width="1280" height="620" fill="#fff"/>
<text x="40" y="42" class="title">整体逻辑架构</text>
<text x="40" y="68" class="m">Evaluation 平台位于应用运行链路之后，统一接收 Trace，并提供调试、评估与回归能力。</text>

<!-- 应用 -->
<rect x="38" y="110" width="250" height="430" rx="18" fill="#edf6ff" stroke="#b9d8f3" class="panel"/>
<text x="62" y="145" class="h">业务应用</text><text x="62" y="167" class="s">Agent 应用与执行生态</text>
<g>
