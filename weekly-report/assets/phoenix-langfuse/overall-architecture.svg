 <rect x="62" y="359" width="202" height="68" rx="10" class="card"/><circle cx="91" cy="393" r="13" fill="#d7ecff"/><path d="M84 401l14-14M85 386l4-4 5 5-4 4M93 398l4 4" fill="none" stroke="#1976d2" stroke-width="2" stroke-linecap="round"/><text x="118" y="389" class="m">Tool / MCP</text><text x="118" y="409" class="s">外部工具</text>
 <rect x="62" y="441" width="202" height="68" rx="10" class="card"/><circle cx="91" cy="475" r="13" fill="#d7ecff"/><rect x="83" y="464" width="16" height="22" rx="3" fill="none" stroke="#1976d2" stroke-width="2"/><path d="M86 470h10M86 475h8M86 480h9" stroke="#1976d2" stroke-width="2"/><text x="118" y="471" class="m">LLM / RAG</text><text x="118" y="491" class="s">模型与知识检索</text>
</g>

<!-- 采集 -->
<rect x="330" y="110" width="250" height="430" rx="18" fill="#f3f0ff" stroke="#d1c9f6" class="panel"/>
<text x="354" y="145" class="h">采集层</text><text x="354" y="167" class="s">多种方式接入运行数据</text>
<g>
 <rect x="354" y="195" width="202" height="88" rx="10" class="card"/><circle cx="390" cy="239" r="20" fill="#ece8ff"/><path d="M380 245c9-14 14-14 22-3M384 232c5-8 10-8 14-3M390 224c2-3 5-3 7-1" fill="none" stroke="#5b4bd8" stroke-width="3" stroke-linecap="round"/><text x="420" y="231" class="m">OpenTelemetry</text><text x="420" y="252" class="s">标准协议采集</text>
