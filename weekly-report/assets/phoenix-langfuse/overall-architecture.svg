<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560">
<style>
text{font-family:Arial,"Microsoft YaHei",sans-serif;fill:#172033}.title{font-size:24px;font-weight:700}.h{font-size:17px;font-weight:700}.s{font-size:13px}.xs{font-size:12px;fill:#5b6679}.box{stroke:#8792a6;stroke-width:1.2;rx:10}.line{stroke:#667085;stroke-width:1.5;fill:none;marker-end:url(#a)}</style>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#667085"/></marker></defs>
<text x="35" y="42" class="title">整体位置：Agent 应用与观测 / 评估平台</text>
<text x="35" y="68" class="s">两个项目都处在应用运行数据与研发分析之间，但内部组织方式不同。</text>

<rect x="40" y="150" width="210" height="250" class="box" fill="#EAF3FF"/>
<text x="145" y="183" text-anchor="middle" class="h">业务应用</text>
<text x="145" y="215" text-anchor="middle" class="s">Agent / Workflow</text>
<text x="145" y="243" text-anchor="middle" class="s">LLM / Tool / RAG</text>
<text x="145" y="271" text-anchor="middle" class="s">Dify / 自定义服务</text>
<text x="145" y="329" text-anchor="middle" class="xs">产生运行 Trace</text>
<text x="145" y="352" text-anchor="middle" class="xs">Token · Latency · Error</text>

<rect x="310" y="175" width="200" height="200" class="box" fill="#F3EEFF"/>
<text x="410" y="208" text-anchor="middle" class="h">采集层</text>
<text x="410" y="245" text-anchor="middle" class="s">OpenTelemetry</text>
<text x="410" y="273" text-anchor="middle" class="s">SDK / Integration</text>
<text x="410" y="301" text-anchor="middle" class="s">OpenInference</text>
<text x="410" y="337" text-anchor="middle" class="xs">传播 Trace Context</text>
<path d="M250 275 H310" class="line"/>

<rect x="575" y="115" width="260" height="320" class="box" fill="#F4F6F8"/>
<text x="705" y="150" text-anchor="middle" class="h">Phoenix / Langfuse</text>
<rect x="605" y="180" width="200" height="48" rx="7" fill="#EAF3FF" stroke="#a8c7e8"/><text x="705" y="210" text-anchor="middle" class="s">Trace / Debug</text>
<rect x="605" y="245" width="200" height="48" rx="7" fill="#EAF7F0" stroke="#9ccbb5"/><text x="705" y="275" text-anchor="middle" class="s">Evaluation / Score</text>
<rect x="605" y="310" width="200" height="48" rx="7" fill="#FFF5E5" stroke="#dfc08a"/><text x="705" y="340" text-anchor="middle" class="s">Dataset / Experiment</text>
<rect x="605" y="375" width="200" height="48" rx="7" fill="#F3EEFF" stroke="#c9c1e4"/><text x="705" y="405" text-anchor="middle" class="s">Prompt / Analytics</text>
<path d="M510 275 H575" class="line"/>

<rect x="900" y="135" width="330" height="280" class="box" fill="#fff"/>
<text x="1065" y="168" text-anchor="middle" class="h">研发使用</text>
<text x="930" y="210" class="s">调试</text><text x="995" y="210" class="xs">还原一次请求的完整执行链</text>
<text x="930" y="252" class="s">分析</text><text x="995" y="252" class="xs">查看耗时、Token、错误和成本</text>
<text x="930" y="294" class="s">评估</text><text x="995" y="294" class="xs">人工 / 规则 / LLM Judge</text>
<text x="930" y="336" class="s">回归</text><text x="995" y="336" class="xs">固定 Dataset 对比新旧版本</text>
<text x="930" y="378" class="s">运营</text><text x="995" y="378" class="xs">Dashboard / Metrics / Session</text>
<path d="M835 275 H900" class="line"/>

<text x="640" y="510" text-anchor="middle" class="s">共同位置相同，真正的选型差异主要来自内部数据模型、评估自动化、分析能力和自部署架构。</text>
</svg>