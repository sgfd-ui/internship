<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="780" viewBox="0 0 1280 780">
  <defs>
    <style>
      text{font-family:Arial,"Microsoft YaHei",sans-serif;fill:#172033}
      .layer{font-size:22px;font-weight:700}
      .group{font-size:18px;font-weight:700}
      .name{font-size:16px;font-weight:700}
      .card{fill:#fff;stroke:#d7dde7;stroke-width:1.2}
      .webFrame{fill:#f9fffc;stroke:#8fd1ad;stroke-width:1.5}
      .workerFrame{fill:#fffaf2;stroke:#edc675;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1280" height="780" fill="#fff"/>

  <!-- 展示层 -->
  <rect x="30" y="24" width="1220" height="108" rx="18" fill="#f2efff" stroke="#d8d0ff"/>
  <rect x="30" y="24" width="165" height="108" rx="18" fill="#e8e2ff"/>
  <path d="M62 55h38v28H62zM69 90h24M81 83v7" fill="none" stroke="#4c2bbf" stroke-width="3"/>
  <text x="125" y="84" class="layer">展示层</text>
  <rect x="225" y="45" width="995" height="66" rx="12" class="card"/>
  <path d="M260 62h34v25h-34zM265 92h24M277 87v5" fill="none" stroke="#7558d8" stroke-width="2.3"/>
  <text x="725" y="86" text-anchor="middle" class="name">Web UI</text>

  <!-- 接口层 -->
  <rect x="30" y="150" width="1220" height="116" rx="18" fill="#eef7ff" stroke="#cde4fa"/>
  <rect x="30" y="150" width="165" height="116" rx="18" fill="#dceeff"/>
  <circle cx="68" cy="194" r="8" fill="none" stroke="#1f5fbf" stroke-width="3"/>
  <circle cx="53" cy="222" r="8" fill="none" stroke="#1f5fbf" stroke-width="3"/>
  <circle cx="83" cy="222" r="8" fill="none" stroke="#1f5fbf" stroke-width="3"/>
  <path d="M65 202l-9 12M71 202l9 12" stroke="#1f5fbf" stroke-width="3"/>
  <text x="125" y="214" class="layer">接口层</text>
  <rect x="215" y="174" width="230" height="68" rx="12" class="card"/>
  <text x="330" y="215" text-anchor="middle" class="name">Public API</text>
  <rect x="465" y="174" width="230" height="68" rx="12" class="card"/>
  <text x="580" y="215" text-anchor="middle" class="name">Internal API</text>
  <rect x="715" y="174" width="230" height="68" rx="12" class="card"/>
  <text x="830" y="215" text-anchor="middle" class="name">Ingestion API</text>
  <rect x="965" y="174" width="255" height="68" rx="12" class="card"/>
  <text x="1092" y="215" text-anchor="middle" class="name">OTLP Endpoint</text>

  <!-- 服务层 -->
  <rect x="30" y="286" width="1220" height="352" rx="18" fill="#ecfaf4" stroke="#c7ead8"/>
  <rect x="30" y="286" width="165" height="352" rx="18" fill="#dcf5e9"/>
  <circle cx="70" cy="446" r="21" fill="none" stroke="#0c6b50" stroke-width="7"/>
  <path d="M70 411v12M70 469v12M35 446h12M93 446h12M45 421l9 9M86 462l9 9M95 421l-9 9M54 462l-9 9" stroke="#0c6b50" stroke-width="6"/>
  <text x="125" y="472" class="layer">服务层</text>

  <rect x="220" y="310" width="660" height="302" rx="16" class="webFrame"/>
  <text x="246" y="342" class="group">Web 服务</text>
  <rect x="246" y="362" width="190" height="62" rx="10" class="card"/>
  <text x="341" y="399" text-anchor="middle" class="name">Trace / Observation</text>
  <rect x="451" y="362" width="190" height="62" rx="10" class="card"/>
  <text x="546" y="399" text-anchor="middle" class="name">Score / Evaluation</text>
  <rect x="656" y="362" width="198" height="62" rx="10" class="card"/>
  <text x="755" y="399" text-anchor="middle" class="name">Dataset / Experiment</text>
  <rect x="246" y="442" width="190" height="62" rx="10" class="card"/>
  <text x="341" y="479" text-anchor="middle" class="name">Prompt</text>
  <rect x="451" y="442" width="190" height="62" rx="10" class="card"/>
  <text x="546" y="479" text-anchor="middle" class="name">Dashboard / Metrics</text>
  <rect x="656" y="442" width="198" height="62" rx="10" class="card"/>
  <text x="755" y="479" text-anchor="middle" class="name">User / Session</text>

  <rect x="900" y="310" width="320" height="302" rx="16" class="workerFrame"/>
  <text x="926" y="342" class="group">Worker</text>
  <rect x="926" y="372" width="125" height="76" rx="10" class="card"/>
  <text x="988" y="416" text-anchor="middle" class="name">数据摄取</text>
  <rect x="1066" y="372" width="128" height="76" rx="10" class="card"/>
  <text x="1130" y="416" text-anchor="middle" class="name">评估执行</text>
  <rect x="926" y="468" width="125" height="76" rx="10" class="card"/>
  <text x="988" y="512" text-anchor="middle" class="name">数据导出</text>
  <rect x="1066" y="468" width="128" height="76" rx="10" class="card"/>
  <text x="1130" y="512" text-anchor="middle" class="name">后台任务</text>

  <!-- 存储层 -->
  <rect x="30" y="658" width="1220" height="92" rx="18" fill="#fff1f3" stroke="#f2cbd2"/>
  <rect x="30" y="658" width="165" height="92" rx="18" fill="#ffe1e6"/>
  <ellipse cx="67" cy="689" rx="21" ry="8" fill="none" stroke="#9a1630" stroke-width="3"/>
  <path d="M46 689v24c0 5 9 8 21 8s21-3 21-8v-24M46 701c0 5 9 8 21 8s21-3 21-8" fill="none" stroke="#9a1630" stroke-width="3"/>
  <text x="125" y="712" class="layer">存储层</text>
  <rect x="215" y="676" width="230" height="56" rx="12" class="card"/>
  <text x="330" y="710" text-anchor="middle" class="name">PostgreSQL</text>
  <rect x="465" y="676" width="230" height="56" rx="12" class="card"/>
  <text x="580" y="710" text-anchor="middle" class="name">ClickHouse</text>
  <rect x="715" y="676" width="230" height="56" rx="12" class="card"/>
  <text x="830" y="710" text-anchor="middle" class="name">Redis / Valkey</text>
  <rect x="965" y="676" width="255" height="56" rx="12" class="card"/>
  <text x="1092" y="710" text-anchor="middle" class="name">Object Storage</text>
</svg>
