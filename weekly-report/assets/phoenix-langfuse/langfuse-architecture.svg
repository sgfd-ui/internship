  <rect x="230" y="355" width="190" height="70" rx="11" class="card"/><text x="325" y="397" text-anchor="middle" class="name">调用链 / 会话 / 用户</text>
  <rect x="435" y="355" width="190" height="70" rx="11" class="card"/><text x="530" y="397" text-anchor="middle" class="name">评分与评估</text>
  <rect x="640" y="355" width="190" height="70" rx="11" class="card"/><text x="735" y="397" text-anchor="middle" class="name">数据集与实验</text>
  <rect x="230" y="445" width="290" height="70" rx="11" class="card"/><text x="375" y="487" text-anchor="middle" class="name">提示词</text>
  <rect x="540" y="445" width="290" height="70" rx="11" class="card"/><text x="685" y="487" text-anchor="middle" class="name">数据看板</text>
  <rect x="875" y="308" width="330" height="295" rx="16" class="workerbox"/>
  <text x="900" y="337" class="group">Worker</text>
  <rect x="900" y="365" width="280" height="60" rx="11" class="card"/><text x="1040" y="402" text-anchor="middle" class="name">数据摄取</text>
  <rect x="900" y="445" width="280" height="60" rx="11" class="card"/><text x="1040" y="482" text-anchor="middle" class="name">评估执行</text>
