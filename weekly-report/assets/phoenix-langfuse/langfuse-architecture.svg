  <rect x="205" y="672" width="230" height="76" rx="12" class="card"/><text x="320" y="716" text-anchor="middle" class="name">PostgreSQL</text>
  <rect x="455" y="672" width="230" height="76" rx="12" class="card"/><text x="570" y="716" text-anchor="middle" class="name">ClickHouse</text>
  <rect x="705" y="672" width="230" height="76" rx="12" class="card"/><text x="820" y="716" text-anchor="middle" class="name">Redis / Valkey</text>
  <rect x="955" y="672" width="250" height="76" rx="12" class="card"/><text x="1080" y="716" text-anchor="middle" class="name">Object Storage</text>
