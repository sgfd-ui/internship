<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <style>
      text{font-family:Arial,"Microsoft YaHei",sans-serif;fill:#172033}
      .layer{font-size:20px;font-weight:700}
      .group{font-size:16px;font-weight:700}
      .name{font-size:15px;font-weight:700}
      .card{fill:#fff;stroke:#d7dde7;stroke-width:1.2}
      .webbox{fill:#fbfdfc;stroke:#bfe4d0;stroke-width:1.4}
      .workerbox{fill:#fffaf2;stroke:#f0cf8d;stroke-width:1.4}
    </style>
  </defs>
  <rect width="1280" height="800" fill="#fff"/>
  <rect x="35" y="25" width="1210" height="100" rx="18" fill="#f2efff" stroke="#d8d0ff"/>
  <rect x="35" y="25" width="150" height="100" rx="18" fill="#e7e0ff"/>
  <text x="110" y="83" text-anchor="middle" class="layer">展示层</text>
  <rect x="360" y="45" width="560" height="60" rx="12" class="card"/>
  <text x="640" y="82" text-anchor="middle" class="name">Web 界面</text>
  <rect x="35" y="145" width="1210" height="120" rx="18" fill="#eef7ff" stroke="#cfe4f7"/>
  <rect x="35" y="145" width="150" height="120" rx="18" fill="#dceeff"/>
  <text x="110" y="213" text-anchor="middle" class="layer">接口层</text>
  <rect x="235" y="171" width="260" height="66" rx="12" class="card"/>
  <text x="365" y="210" text-anchor="middle" class="name">开放接口</text>
  <rect x="515" y="171" width="260" height="66" rx="12" class="card"/>
  <text x="645" y="210" text-anchor="middle" class="name">平台接口</text>
  <rect x="795" y="171" width="300" height="66" rx="12" class="card"/>
  <text x="945" y="210" text-anchor="middle" class="name">数据接收</text>
  <rect x="35" y="285" width="1210" height="345" rx="18" fill="#ecfaf4" stroke="#c7ead8"/>
  <rect x="35" y="285" width="150" height="345" rx="18" fill="#dcf5e9"/>
  <text x="110" y="467" text-anchor="middle" class="layer">服务层</text>
  <rect x="205" y="308" width="650" height="295" rx="16" class="webbox"/>
