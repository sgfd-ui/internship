<rect x="398" y="372" width="78" height="34" rx="8" fill="#fff" stroke="#d7dfeb"/><text x="437" y="394" text-anchor="middle" class="s">Trace ID</text><rect x="486" y="372" width="86" height="34" rx="8" fill="#fff" stroke="#d7dfeb"/><text x="529" y="394" text-anchor="middle" class="s">Span Context</text>

