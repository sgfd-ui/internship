<rect x="62" y="379" width="232" height="72" rx="10" class="card"/><circle cx="92" cy="415" r="14" fill="#d7ecff"/><rect x="84" y="404" width="16" height="22" rx="3" fill="none" stroke="#1976d2" stroke-width="2"/><path d="M87 410h10M87 415h8M87 420h9" stroke="#1976d2" stroke-width="2"/><text x="122" y="411" class="m">LLM</text><text x="122" y="431" class="s">模型输入输出与 Token</text>

<rect x="38" y="520" width="280" height="70" rx="15" fill="#f3f0ff" stroke="#d1c9f6"/>
<path d="M70 557l12-10 12 10-12 10zM82 547v20" fill="none" stroke="#5b4bd8" stroke-width="2.4"/><text x="108" y="552" class="m">外部 Agent / Tool</text><text x="108" y="572" class="s">通过 SDK / OpenTelemetry 补充 Span</text>

<!-- trace context -->
<rect x="370" y="205" width="230" height="245" rx="18" fill="#f3f0ff" stroke="#d1c9f6"/>
<text x="394" y="240" class="h">Trace Context</text><text x="394" y="263" class="s">保持父子调用关系连续</text>
