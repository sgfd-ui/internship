<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620">
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#7b8ba7"/></marker><style>text{font-family:Arial,"Microsoft YaHei",sans-serif;fill:#172033}.title{font-size:24px;font-weight:700}.h{font-size:18px;font-weight:700}.m{font-size:14px}.s{font-size:12px;fill:#63708a}.card{fill:#fff;stroke:#d7dfeb;stroke-width:1}.line{stroke:#7b8ba7;stroke-width:2;fill:none;marker-end:url(#a)}</style></defs>
<rect width="1280" height="620" fill="#fff"/>
<text x="40" y="42" class="title">Dify 接入方式</text><text x="40" y="68" class="m">Dify 内部节点原生上报；平台外部 Agent / Tool 继续补 Trace，并传播同一个 Trace Context。</text>

<!-- left -->
<rect x="38" y="115" width="280" height="385" rx="18" fill="#edf6ff" stroke="#b9d8f3"/>
