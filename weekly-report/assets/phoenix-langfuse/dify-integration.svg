<rect x="1006" y="205" width="212" height="72" rx="10" class="card"/><circle cx="1035" cy="241" r="13" fill="#fff0d8"/><circle cx="1035" cy="228" r="5" fill="none" stroke="#f59e0b" stroke-width="2"/><circle cx="1024" cy="251" r="5" fill="none" stroke="#f59e0b" stroke-width="2"/><circle cx="1046" cy="251" r="5" fill="none" stroke="#f59e0b" stroke-width="2"/><path d="M1035 233v8M1035 241l-11 5M1035 241l11 5" stroke="#f59e0b" stroke-width="2"/><text x="1065" y="237" class="m">Workflow</text><text x="1065" y="257" class="s">父子节点与执行顺序</text>
<rect x="1006" y="292" width="212" height="72" rx="10" class="card"/><circle cx="1035" cy="328" r="13" fill="#fff0d8"/><path d="M1027 336l14-14M1028 321l4-4 5 5-4 4M1036 333l4 4" fill="none" stroke="#f59e0b" stroke-width="2"/><text x="1065" y="324" class="m">Tool</text><text x="1065" y="344" class="s">输入、输出与耗时</text>
