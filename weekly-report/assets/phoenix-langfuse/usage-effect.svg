<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620">
<style>
text{font-family:Arial,"Microsoft YaHei",sans-serif;fill:#172033}.title{font-size:24px;font-weight:700}.h{font-size:18px;font-weight:700}.s{font-size:14px}.xs{font-size:12px;fill:#596579}.box{stroke:#8792a6;stroke-width:1.2;rx:10}.line{stroke:#667085;stroke-width:1.5;fill:none;marker-end:url(#a)}.thin{stroke:#a3adbd;stroke-width:1.2;fill:none}
</style>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#667085"/></marker></defs>
<text x="40" y="42" class="title">接入后的使用效果</text>
<text x="40" y="68" class="s">把一次 Agent 运行从“日志”变成可定位、可评估、可回归的数据。</text>

<rect x="40" y="120" width="220" height="330" class="box" fill="#EAF3FF"/>
<text x="150" y="154" text-anchor="middle" class="h">Agent / Workflow</text>
<text x="150" y="180" text-anchor="middle" class="xs">真实运行请求</text>
<rect x="65" y="210" width="170" height="42" rx="7" fill="#fff" stroke="#c7d2e3"/><text x="150" y="236" text-anchor="middle" class="s">LLM 调用</text>
<rect x="65" y="268" width="170" height="42" rx="7" fill="#fff" stroke="#c7d2e3"/><text x="150" y="294" text-anchor="middle" class="s">Tool / Retriever</text>
<rect x="65" y="326" width="170" height="42" rx="7" fill="#fff" stroke="#c7d2e3"/><text x="150" y="352" text-anchor="middle" class="s">Workflow / Agent</text>
<text x="150" y="410" text-anchor="middle" class="xs">Trace · Token · Latency · Error</text>

<rect x="340" y="165" width="250" height="240" class="box" fill="#F3EEFF"/>
<text x="465" y="200" text-anchor="middle" class="h">Phoenix / Langfuse</text>
<text x="465" y="226" text-anchor="middle" class="xs">采集、组织、查询运行数据</text>
<rect x="375" y="255" width="180" height="38" rx="7" fill="#fff" stroke="#c9c1e4"/><text x="465" y="279" text-anchor="middle" class="s">Trace / Span 组织</text>
<rect x="375" y="307" width="180" height="38" rx="7" fill="#fff" stroke="#c9c1e4"/><text x="465" y="331" text-anchor="middle" class="s">Evaluation / Score</text>
<rect x="375" y="359" width="180" height="38" rx="7" fill="#fff" stroke="#c9c1e4"/><text x="465" y="383" text-anchor="middle" class="s">Dataset / Experiment</text>
<path d="M260 285 H340" class="line"/>

<rect x="675" y="105" width="545" height="145" class="box" fill="#EAF3FF"/>
<text x="700" y="138" class="h">1. 定位问题：完整调用链</text>
<text x="700" y="164" class="s">看到父子节点、输入输出、错误、Token、耗时和成本。</text>
<line x1="705" y1="198" x2="1170" y2="198" class="thin"/>
<rect x="720" y="184" width="115" height="22" rx="5" fill="#cfe3ff"/><rect x="855" y="184" width="70" height="22" rx="5" fill="#dfe8f5"/><rect x="945" y="184" width="150" height="22" rx="5" fill="#b8d8ff"/><rect x="1115" y="184" width="45" height="22" rx="5" fill="#dfe8f5"/>
<text x="720" y="228" class="xs">agent.run</text><text x="855" y="228" class="xs">tool</text><text x="945" y="228" class="xs">llm.call</text>

<rect x="675" y="275" width="545" height="125" class="box" fill="#EAF7F0"/>
<text x="700" y="308" class="h">2. 判断质量：Evaluation</text>
<text x="700" y="334" class="s">人工、规则或 LLM-as-a-Judge 对线上结果打分，并筛出失败 Case。</text>
<text x="720" y="370" class="s">correctness  0.92</text><text x="900" y="370" class="s">relevance  0.86</text><text x="1060" y="370" class="s">error  3.1%</text>

<rect x="675" y="425" width="545" height="125" class="box" fill="#FFF5E5"/>
<text x="700" y="458" class="h">3. 验证改动：Dataset → Experiment</text>
<text x="700" y="484" class="s">把失败 / 典型 Case 固化为测试集，在相同数据上比较新旧 Prompt、Model 或应用版本。</text>
<text x="720" y="522" class="s">v1  score 0.72</text><text x="900" y="522" class="s">v2  score 0.81</text><text x="1070" y="522" class="s">↑ +0.09</text>

<path d="M590 240 C625 240 630 175 675 175" class="line"/>
<path d="M590 285 H675" class="line"/>
<path d="M590 330 C630 330 635 487 675 487" class="line"/>
<text x="640" y="595" text-anchor="middle" class="s">核心效果：调试运行链路 → 量化结果质量 → 用固定 Case 验证改动。</text>
</svg>