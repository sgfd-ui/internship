<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#667085"/>
    </marker>
    <style>
      text{font-family:Arial,"Microsoft YaHei",sans-serif;fill:#182230}
      .title{font-size:22px;font-weight:700}.h{font-size:17px;font-weight:700}.m{font-size:14px}.s{font-size:12px;fill:#475467}
      .line{stroke:#667085;stroke-width:1.7;fill:none;marker-end:url(#arrow)}
      .soft{stroke:#CBD5E1;stroke-width:1.2}
    </style>
  </defs>

  <rect width="1200" height="560" fill="#FFFFFF"/>

  <rect x="28" y="62" width="180" height="410" rx="14" fill="#F4F7FB" class="soft"/>
  <text x="118" y="98" text-anchor="middle" class="title">Agent / 应用</text>
  <g class="m">
    <rect x="48" y="125" width="140" height="46" rx="8" fill="#FFFFFF" class="soft"/><text x="118" y="153" text-anchor="middle">Chatbot</text>
    <rect x="48" y="185" width="140" height="46" rx="8" fill="#FFFFFF" class="soft"/><text x="118" y="213" text-anchor="middle">Agent</text>
    <rect x="48" y="245" width="140" height="46" rx="8" fill="#FFFFFF" class="soft"/><text x="118" y="273" text-anchor="middle">Workflow</text>
    <rect x="48" y="305" width="140" height="46" rx="8" fill="#FFFFFF" class="soft"/><text x="118" y="333" text-anchor="middle">LLM / Tool</text>
    <rect x="48" y="365" width="140" height="46" rx="8" fill="#FFFFFF" class="soft"/><text x="118" y="393" text-anchor="middle">自定义服务</text>
  </g>

  <path d="M208 267 H280" class="line"/>
  <text x="244" y="239" text-anchor="middle" class="s">SDK / OTel</text>
  <text x="244" y="257" text-anchor="middle" class="s">OpenInference</text>

  <rect x="280" y="95" width="265" height="345" rx="16" fill="#EEF4FF" stroke="#84ADFF" stroke-width="1.4"/>
  <text x="412" y="132" text-anchor="middle" class="title">Evaluation 平台</text>
  <rect x="310" y="162" width="205" height="66" rx="10" fill="#FFFFFF" stroke="#B2CCFF"/>
  <text x="412" y="188" text-anchor="middle" class="h">Trace 数据接收</text>
  <text x="412" y="211" text-anchor="middle" class="s">Trace · Span · Event</text>
  <rect x="310" y="247" width="205" height="66" rx="10" fill="#FFFFFF" stroke="#B2CCFF"/>
  <text x="412" y="273" text-anchor="middle" class="h">评估与数据管理</text>
  <text x="412" y="296" text-anchor="middle" class="s">Evaluation · Dataset</text>
  <rect x="310" y="332" width="205" height="66" rx="10" fill="#FFFFFF" stroke="#B2CCFF"/>
  <text x="412" y="358" text-anchor="middle" class="h">调试与实验</text>
  <text x="412" y="381" text-anchor="middle" class="s">Prompt · Experiment · UI</text>

  <path d="M545 198 H610" class="line"/>
  <path d="M545 278 C580 278 580 322 610 322" class="line"/>
  <path d="M545 365 C580 365 580 446 610 446" class="line"/>

  <rect x="610" y="42" width="560" height="142" rx="14" fill="#F7F9FC" class="soft"/>
  <text x="632" y="72" class="h">Trace / Span：看清一次请求怎么跑</text>
  <line x1="655" y1="101" x2="1136" y2="101" stroke="#E4E7EC"/>
  <text x="632" y="121" class="s">agent.run</text><rect x="720" y="108" width="290" height="12" rx="6" fill="#84ADFF"/>
  <text x="632" y="144" class="s">tool.search</text><rect x="760" y="131" width="145" height="12" rx="6" fill="#75E0A7"/>
  <text x="632" y="167" class="s">llm.call</text><rect x="930" y="154" width="160" height="12" rx="6" fill="#FEC84B"/>
  <text x="1110" y="121" class="s">2.3s</text><text x="1110" y="144" class="s">0.8s</text><text x="1110" y="167" class="s">1.1s</text>

  <rect x="610" y="202" width="270" height="170" rx="14" fill="#F6FEF9" stroke="#A6F4C5"/>
  <text x="632" y="232" class="h">Evaluation</text>
  <text x="632" y="256" class="s">自动 / 人工评分</text>
  <line x1="632" y1="274" x2="858" y2="274" stroke="#D1FADF"/>
  <text x="632" y="299" class="s">Correctness</text><text x="808" y="299" class="m">0.92</text><circle cx="844" cy="294" r="6" fill="#32D583"/>
  <text x="632" y="326" class="s">Relevance</text><text x="808" y="326" class="m">0.85</text><circle cx="844" cy="321" r="6" fill="#32D583"/>
  <text x="632" y="353" class="s">Helpfulness</text><text x="808" y="353" class="m">0.61</text><circle cx="844" cy="348" r="6" fill="#F79009"/>

  <rect x="900" y="202" width="270" height="170" rx="14" fill="#FFF9F2" stroke="#FEDF89"/>
  <text x="922" y="232" class="h">Dataset</text>
  <text x="922" y="256" class="s">把失败 / 典型 Case 沉淀下来</text>
  <line x1="922" y1="274" x2="1148" y2="274" stroke="#FEEFC7"/>
  <text x="922" y="299" class="s">regression_set</text><text x="1100" y="299" class="m">300</text>
  <text x="922" y="326" class="s">tool_error</text><text x="1100" y="326" class="m">84</text>
  <text x="922" y="353" class="s">prompt_cases</text><text x="1100" y="353" class="m">120</text>

  <rect x="610" y="392" width="560" height="126" rx="14" fill="#FBF8FF" stroke="#D9D6FE"/>
  <text x="632" y="422" class="h">Experiment：改完以后有没有变好</text>
  <text x="632" y="449" class="s">版本</text><text x="790" y="449" class="s">Score</text><text x="900" y="449" class="s">Latency</text><text x="1010" y="449" class="s">Cost</text>
  <line x1="632" y1="458" x2="1148" y2="458" stroke="#E9EAEB"/>
  <text x="632" y="481" class="m">v1 baseline</text><text x="790" y="481" class="m">0.72</text><text x="900" y="481" class="m">2.3s</text><text x="1010" y="481" class="m">$0.012</text>
  <text x="632" y="506" class="m">v2 new prompt</text><text x="790" y="506" class="m">0.81</text><text x="900" y="506" class="m">2.1s</text><text x="1010" y="506" class="m">$0.013</text><text x="1100" y="506" class="m" fill="#17B26A">↑ better</text>

  <text x="600" y="548" text-anchor="middle" class="s">接入后：从“只能看最终回答”变成“能还原调用链、定位问题、评估质量，并用同一批 Case 验证改动”。</text>
</svg>