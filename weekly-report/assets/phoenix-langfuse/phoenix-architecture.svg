<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760">
  <defs>
    <style>
      text{font-family:Arial,"Microsoft YaHei",sans-serif;fill:#172033}
      .layer{font-size:22px;font-weight:700}
      .group{font-size:18px;font-weight:700}
      .name{font-size:16px;font-weight:700}
      .card{fill:#fff;stroke:#d7dde7;stroke-width:1.2}
      .serviceFrame{fill:#fbfdfc;stroke:#9ed8ba;stroke-width:1.6}
      .coreBox{fill:#f9fffc;stroke:#8fd1ad;stroke-width:1.3}
      .bgBox{fill:#fffaf2;stroke:#edc675;stroke-width:1.3}
    </style>
  </defs>
  <rect width="1280" height="760" fill="#fff"/>

  <!-- 展示层 -->
  <rect x="30" y="24" width="1220" height="108" rx="18" fill="#f2efff" stroke="#d8d0ff"/>
