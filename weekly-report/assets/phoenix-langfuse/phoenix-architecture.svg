  <rect x="902" y="408" width="130" height="60" rx="10" class="card"/>
  <text x="967" y="444" text-anchor="middle" class="name">Trace 写入</text>
  <rect x="1045" y="408" width="128" height="60" rx="10" class="card"/>
  <text x="1109" y="444" text-anchor="middle" class="name">实验执行</text>
  <rect x="902" y="486" width="130" height="60" rx="10" class="card"/>
  <text x="967" y="522" text-anchor="middle" class="name">成本计算</text>
  <rect x="1045" y="486" width="128" height="60" rx="10" class="card"/>
  <text x="1109" y="522" text-anchor="middle" class="name">数据清理</text>

