<rect x="275" y="105" width="230" height="100" class="box" fill="#EAF7F3"/><text x="390" y="144" text-anchor="middle" class="t">OpenTelemetry</text><text x="390" y="172" text-anchor="middle" class="s">OpenInference 补充 AI 语义</text>
