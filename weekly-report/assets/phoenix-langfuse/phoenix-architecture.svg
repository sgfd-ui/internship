<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="720" viewBox="0 0 1320 720">
<style>
text{font-family:Arial,"Microsoft YaHei",sans-serif;fill:#172033}.title{font-size:24px;font-weight:700}.h{font-size:17px;font-weight:700}.s{font-size:13px}.xs{font-size:12px;fill:#5b6679}.box{stroke:#8792a6;stroke-width:1.2;rx:10}.line{stroke:#667085;stroke-width:1.5;fill:none;marker-end:url(#a)}.dash{stroke:#98a2b3;stroke-width:1.3;stroke-dasharray:6 5;fill:none;marker-end:url(#a)}</style>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#667085"/></marker></defs>
<text x="35" y="42" class="title">Phoenix 核心架构</text>
<text x="35" y="68" class="s">特点：以 OpenTelemetry / OpenInference Trace 为中心，采集、查询、评估和实验能力集中在 Phoenix Server。</text>

<rect x="35" y="120" width="210" height="260" class="box" fill="#EAF3FF"/>
<text x="140" y="153" text-anchor="middle" class="h">应用侧</text>
<rect x="60" y="180" width="160" height="42" rx="7" fill="#fff" stroke="#c7d2e3"/><text x="140" y="206" text-anchor="middle" class="s">Agent / Workflow</text>
<rect x="60" y="238" width="160" height="42" rx="7" fill="#fff" stroke="#c7d2e3"/><text x="140" y="264" text-anchor="middle" class="s">LLM / Tool / RAG</text>
<rect x="60" y="296" width="160" height="42" rx="7" fill="#fff" stroke="#c7d2e3"/><text x="140" y="322" text-anchor="middle" class="s">Dify / LangChain 等</text>

<rect x="300" y="150" width="220" height="200" class="box" fill="#F3EEFF"/>
<text x="410" y="183" text-anchor="middle" class="h">采集与语义层</text>
<text x="410" y="213" text-anchor="middle" class="s">OpenTelemetry</text>
<text x="410" y="238" text-anchor="middle" class="s">OpenInference</text>
<text x="410" y="273" text-anchor="middle" class="xs">AGENT · LLM · TOOL</text>
<text x="410" y="295" text-anchor="middle" class="xs">RETRIEVER · EMBEDDING</text>
<text x="410" y="327" text-anchor="middle" class="xs">OTLP HTTP / gRPC</text>
<path d="M245 250 H300" class="line"/>

<rect x="585" y="105" width="390" height="390" class="box" fill="#F4F6F8"/>
<text x="780" y="140" text-anchor="middle" class="h">Phoenix Server</text>
<rect x="615" y="170" width="150" height="72" rx="8" fill="#fff" stroke="#bcc5d2"/><text x="690" y="198" text-anchor="middle" class="s">OTLP Receiver</text><text x="690" y="220" text-anchor="middle" class="xs">接收 Trace</text>
<rect x="795" y="170" width="150" height="72" rx="8" fill="#fff" stroke="#bcc5d2"/><text x="870" y="198" text-anchor="middle" class="s">Trace Query</text><text x="870" y="220" text-anchor="middle" class="xs">查询 / 筛选 / 聚合</text>
<rect x="615" y="270" width="150" height="72" rx="8" fill="#EAF7F0" stroke="#9ccbb5"/><text x="690" y="298" text-anchor="middle" class="s">Evaluation</text><text x="690" y="320" text-anchor="middle" class="xs">Annotation / Evaluator</text>
<rect x="795" y="270" width="150" height="72" rx="8" fill="#FFF5E5" stroke="#dfc08a"/><text x="870" y="298" text-anchor="middle" class="s">Dataset / Experiment</text><text x="870" y="320" text-anchor="middle" class="xs">Case / Run / Compare</text>
<rect x="615" y="370" width="150" height="72" rx="8" fill="#EAF3FF" stroke="#a8c7e8"/><text x="690" y="398" text-anchor="middle" class="s">Prompt / Playground</text><text x="690" y="420" text-anchor="middle" class="xs">Version / Replay</text>
<rect x="795" y="370" width="150" height="72" rx="8" fill="#fff" stroke="#bcc5d2"/><text x="870" y="398" text-anchor="middle" class="s">Web UI / API</text><text x="870" y="420" text-anchor="middle" class="xs">研发查看与操作</text>
<path d="M520 250 H585" class="line"/>

<rect x="1040" y="155" width="235" height="150" class="box" fill="#EAF7F0"/>
<text x="1158" y="188" text-anchor="middle" class="h">运行数据模型</text>
<text x="1158" y="220" text-anchor="middle" class="s">Project → Session → Trace</text>
<text x="1158" y="247" text-anchor="middle" class="s">→ Span</text>
<text x="1158" y="278" text-anchor="middle" class="xs">Span Kind 直接表达 AI 节点语义</text>
<path d="M975 220 H1040" class="line"/>

<rect x="1040" y="350" width="235" height="145" class="box" fill="#FFF5E5"/>
<text x="1158" y="384" text-anchor="middle" class="h">持久化</text>
<text x="1158" y="418" text-anchor="middle" class="s">SQLite</text>
<text x="1158" y="444" text-anchor="middle" class="s">或 PostgreSQL</text>
<text x="1158" y="474" text-anchor="middle" class="xs">无强制独立 Queue / OLAP / Object Store</text>
<path d="M975 420 H1040" class="line"/>

<rect x="300" y="545" width="975" height="110" class="box" fill="#fff"/>
<text x="325" y="578" class="h">架构特征</text>
<text x="325" y="610" class="s">① 标准 Trace 是主轴：采集后的核心对象就是 Trace / Span。</text>
<text x="690" y="610" class="s">② 平台能力集中：Trace、Eval、Dataset、Prompt 基本都在 Phoenix Server 内。</text>
<text x="325" y="636" class="s">③ 外部依赖少：生产主要增加 PostgreSQL；整体部署和故障面更集中。</text>
</svg>