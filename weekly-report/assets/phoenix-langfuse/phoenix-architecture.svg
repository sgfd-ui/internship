  <ellipse cx="67" cy="678" rx="21" ry="8" fill="none" stroke="#9a1630" stroke-width="3"/>
  <path d="M46 678v24c0 5 9 8 21 8s21-3 21-8v-24M46 690c0 5 9 8 21 8s21-3 21-8" fill="none" stroke="#9a1630" stroke-width="3"/>
