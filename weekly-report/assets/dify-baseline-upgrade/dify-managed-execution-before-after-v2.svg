<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbfdff"/><stop offset="1" stop-color="#f3f6fb"/></linearGradient>
  <linearGradient id="blueTop" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dcecff"/><stop offset="1" stop-color="#bcd7ff"/></linearGradient>
  <linearGradient id="purpleTop" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eee5ff"/><stop offset="1" stop-color="#d8c6ff"/></linearGradient>
  <linearGradient id="greenTop" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ddf8ea"/><stop offset="1" stop-color="#bcebd2"/></linearGradient>
  <linearGradient id="orangeTop" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff0d6"/><stop offset="1" stop-color="#ffd79a"/></linearGradient>
  <linearGradient id="redTop" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffe6e1"/><stop offset="1" stop-color="#ffc6b8"/></linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#24324a" flood-opacity=".14"/></filter>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#24324a" flood-opacity=".12"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10 z" fill="#667085"/></marker>
  <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10 z" fill="#d64f3b"/></marker>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#172033}
    .title{font-size:32px;font-weight:700}.sub{font-size:17px;fill:#667085}
    .panel{font-size:22px;font-weight:700}.name{font-size:15px;font-weight:700}.small{font-size:13px;fill:#667085}
    .tiny{font-size:12px;fill:#667085}.tag{font-size:13px;font-weight:700}
    .line{stroke:#667085;stroke-width:2.4;fill:none;marker-end:url(#arrow)}
    .lineRed{stroke:#d64f3b;stroke-width:2.7;fill:none;marker-end:url(#arrowRed)}
  </style>
</defs>

<rect width="1600" height="920" fill="url(#bg)"/>
<text x="70" y="62" class="title">托管执行迁移：为什么不是“代码搬过去”</text>
<text x="70" y="96" class="sub">公司调度中心可以保留，真正变化的是 Worker 与 Dify Runtime 的连接方式</text>

<!-- center divider -->
<path d="M800 135 L800 835" stroke="#d8dee9" stroke-width="2" stroke-dasharray="8 9"/>
<text x="390" y="145" text-anchor="middle" class="panel">旧架构 · 1.14.x</text>
<text x="1210" y="145" text-anchor="middle" class="panel">目标架构 · 1.17.1</text>

<!-- LEFT: gateway plane -->
<g filter="url(#shadow)">
  <polygon points="100,205 365,155 690,225 425,278" fill="url(#blueTop)" stroke="#8fb5eb" stroke-width="1.8"/>
  <polygon points="100,205 425,278 425,314 100,240" fill="#b6cff3"/>
  <polygon points="425,278 690,225 690,260 425,314" fill="#9fbee9"/>
</g>
<text x="396" y="218" text-anchor="middle" class="name">API / WebApp / Console</text>

