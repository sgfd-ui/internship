<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style>
      .title{font:700 34px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#17223b}
      .sub{font:400 18px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#667085}
      .h{font:700 21px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
      .t{font:500 16px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#344054}
      .s{font:400 14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#667085}
      .badge{font:700 14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
      .arrow{stroke:#98a2b3;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#98a2b3"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#fbfcfe"/>
  <text x="70" y="68" class="title">高工作量集中在哪里</text>
  <text x="70" y="102" class="sub">调度中心主体可复用，工作量主要集中在执行边界、状态协议和调试 / 暂停链路</text>

  <rect x="70" y="150" rx="22" width="1460" height="120" fill="#eef4ff" stroke="#b2ccff" stroke-width="2"/>
  <text x="105" y="188" class="h" fill="#175cd3">① 请求入口与公司调度层</text>
  <rect x="350" y="176" rx="12" width="220" height="60" fill="#fff" stroke="#84adff"/>
  <text x="460" y="202" text-anchor="middle" class="t">API / WebApp 路由</text>
  <text x="460" y="223" text-anchor="middle" class="s">托管 / 官方路径判断</text>
  <path d="M570 206 L645 206" class="arrow"/>
  <rect x="655" y="176" rx="12" width="230" height="60" fill="#fff" stroke="#84adff"/>
  <text x="770" y="202" text-anchor="middle" class="t">Admission / Policy / Job</text>
  <text x="770" y="223" text-anchor="middle" class="s">大部分规则可复用</text>
  <path d="M885 206 L960 206" class="arrow"/>
  <rect x="970" y="176" rx="12" width="230" height="60" fill="#fff" stroke="#84adff"/>
  <text x="1085" y="202" text-anchor="middle" class="t">Scheduler / Queue</text>
  <text x="1085" y="223" text-anchor="middle" class="s">优先级 / Lease / Outbox</text>
  <path d="M1200 206 L1275 206" class="arrow"/>
  <rect x="1285" y="176" rx="12" width="200" height="60" fill="#fff7ed" stroke="#f7b955" stroke-width="2"/>
  <text x="1385" y="202" text-anchor="middle" class="t">Managed Worker</text>
  <text x="1385" y="223" text-anchor="middle" class="s">执行入口需重写</text>

  <rect x="70" y="300" rx="22" width="1460" height="220" fill="#fff7ed" stroke="#f7c78d" stroke-width="2"/>
  <text x="105" y="340" class="h" fill="#b54708">② 最重：公司 Worker ↔ Dify 1.17.1 Runtime 边界</text>

  <rect x="125" y="375" rx="14" width="255" height="105" fill="#fff" stroke="#f7b955" stroke-width="2"/>
  <text x="252" y="405" text-anchor="middle" class="t">Workflow / Chatflow</text>
  <text x="252" y="430" text-anchor="middle" class="s">AppExecutionParams / Task</text>
  <text x="252" y="453" text-anchor="middle" class="s">WorkflowRun / SSE</text>

  <rect x="445" y="375" rx="14" width="255" height="105" fill="#fff" stroke="#f7b955" stroke-width="2"/>
  <text x="572" y="405" text-anchor="middle" class="t">Chat / Completion</text>
  <text x="572" y="430" text-anchor="middle" class="s">Session / Message</text>
  <text x="572" y="453" text-anchor="middle" class="s">Streaming / Blocking</text>

  <rect x="765" y="375" rx="14" width="255" height="105" fill="#fff" stroke="#f7b955" stroke-width="2"/>
  <text x="892" y="405" text-anchor="middle" class="t">Agent</text>
  <text x="892" y="430" text-anchor="middle" class="s">AGENT_CHAT / 新 Agent</text>
  <text x="892" y="453" text-anchor="middle" class="s">两套 Runtime 差异</text>

  <rect x="1085" y="375" rx="14" width="380" height="105" fill="#fff0ed" stroke="#e66c4f" stroke-width="3"/>
  <text x="1275" y="405" text-anchor="middle" class="t">统一结果与控制协议</text>
  <text x="1275" y="430" text-anchor="middle" class="s">job_id ↔ workflow_run_id ↔ task_id</text>
  <text x="1275" y="453" text-anchor="middle" class="s">Stop / Cancel / Retry / Terminal State</text>
  <rect x="1360" y="388" rx="10" width="78" height="28" fill="#fee4e2"/>
  <text x="1399" y="408" text-anchor="middle" class="badge" fill="#b42318">最重</text>

  <rect x="70" y="550" rx="22" width="1460" height="220" fill="#f7f3ff" stroke="#c7a7ff" stroke-width="2"/>
  <text x="105" y="590" class="h" fill="#6941c6">③ 另一块重活：调试、暂停恢复与触发</text>

  <rect x="125" y="625" rx="14" width="330" height="105" fill="#fff" stroke="#c7a7ff" stroke-width="2"/>
  <text x="290" y="655" text-anchor="middle" class="t">Console 调试</text>
  <text x="290" y="680" text-anchor="middle" class="s">草稿 / 单节点 / Iteration / Loop</text>
  <text x="290" y="703" text-anchor="middle" class="s">快照、事件、SSE、前端状态</text>

  <rect x="500" y="625" rx="14" width="330" height="105" fill="#fff" stroke="#c7a7ff" stroke-width="2"/>
  <text x="665" y="655" text-anchor="middle" class="t">Human Input</text>
  <text x="665" y="680" text-anchor="middle" class="s">WorkflowPause / ResumptionContext</text>
  <text x="665" y="703" text-anchor="middle" class="s">generation / fence / resume 幂等</text>

  <rect x="875" y="625" rx="14" width="330" height="105" fill="#fff" stroke="#c7a7ff" stroke-width="2"/>
  <text x="1040" y="655" text-anchor="middle" class="t">Schedule</text>
  <text x="1040" y="680" text-anchor="middle" class="s">正式触发 + 草稿调试</text>
  <text x="1040" y="703" text-anchor="middle" class="s">避免旧 / 新轮询重复执行</text>

  <rect x="1250" y="625" rx="14" width="215" height="105" fill="#fff" stroke="#c7a7ff" stroke-width="2"/>
  <text x="1357" y="655" text-anchor="middle" class="t">前端与管理端</text>
  <text x="1357" y="680" text-anchor="middle" class="s">Job 状态 / 健康</text>
  <text x="1357" y="703" text-anchor="middle" class="s">Audit / 错误展示</text>

  <rect x="280" y="810" rx="18" width="1040" height="52" fill="#f2f4f7" stroke="#d0d5dd"/>
  <text x="800" y="842" text-anchor="middle" class="t">因此高工作量不是“搬代码”，而是把多套状态机和执行协议重新接到 1.17.1 官方链路</text>
</svg>