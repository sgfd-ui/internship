<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960">
<defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#172033}
.t{font-size:30px;font-weight:700}.st{font-size:15px;fill:#667085}.pt{font-size:23px;font-weight:700}.ps{font-size:14px;fill:#667085}
