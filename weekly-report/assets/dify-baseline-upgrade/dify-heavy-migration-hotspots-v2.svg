<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fcfdff"/><stop offset="1" stop-color="#f4f6fb"/></linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dfeeff"/><stop offset="1" stop-color="#b9d6ff"/></linearGradient>
  <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eee5ff"/><stop offset="1" stop-color="#d8c6ff"/></linearGradient>
  <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff0d6"/><stop offset="1" stop-color="#ffd08a"/></linearGradient>
  <linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffe6e1"/><stop offset="1" stop-color="#ffbaa8"/></linearGradient>
  <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dcf7e9"/><stop offset="1" stop-color="#b8e8cf"/></linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="10" stdDeviation="11" flood-color="#24324a" flood-opacity=".14"/></filter>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#24324a" flood-opacity=".12"/></filter>
  <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10 z" fill="#667085"/></marker>
  <marker id="r" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10 z" fill="#c94c3a"/></marker>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#172033}
    .title{font-size:32px;font-weight:700}.sub{font-size:17px;fill:#667085}.h{font-size:19px;font-weight:700}
    .name{font-size:15px;font-weight:700}.small{font-size:13px;fill:#667085}.tiny{font-size:12px;fill:#667085}
    .hot{font-size:13px;font-weight:700;fill:#b42318}.line{stroke:#667085;stroke-width:2.4;fill:none;marker-end:url(#a)}
    .hotline{stroke:#c94c3a;stroke-width:2.7;fill:none;marker-end:url(#r)}
  </style>
</defs>

<rect width="1600" height="920" fill="url(#bg)"/>
<text x="70" y="62" class="title">高工作量迁移分布：重活集中在执行边界</text>
