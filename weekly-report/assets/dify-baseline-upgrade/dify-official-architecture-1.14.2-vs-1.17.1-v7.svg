<rect x="22" y="62" width="755" height="805" rx="18" fill="#f8fbff" stroke="#d9e4f1"/>
<rect x="823" y="62" width="755" height="805" rx="18" fill="#f8fbff" stroke="#d9e4f1"/>
<text x="400" y="94" text-anchor="middle" class="pt">Dify 1.14.2 官方架构</text>
<text x="400" y="119" text-anchor="middle" class="ps">按 AppMode 分发；Workflow / Chatflow Streaming 已走异步执行任务</text>
<text x="1200" y="94" text-anchor="middle" class="pt">Dify 1.17.1 官方架构</text>
<text x="1200" y="119" text-anchor="middle" class="ps">延续官方执行主链，并强化 Session、Agent 与 Human Input 恢复能力</text>

