<!-- compact diff strip -->
<rect x="22" y="878" width="1556" height="28" rx="8" fill="#f4f6f9" stroke="#e2e6ec"/>
<text x="44" y="897" class="s">核心差异：1.17.1 并不是“新增一套公司调度架构”，而是在官方主链上增加显式 Session、新 Agent App、Human Input 的 WorkflowPause / Resume 等能力；Workflow / Chatflow Streaming 仍使用官方异步执行任务。</text>
