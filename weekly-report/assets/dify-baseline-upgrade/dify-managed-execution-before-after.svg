<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style>
      .title{font:700 34px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#17223b}
      .sub{font:400 18px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#667085}
      .h{font:700 22px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#344054}
      .t{font:500 17px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#344054}
      .s{font:400 15px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#667085}
      .badge{font:700 14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
      .arrow{stroke:#98a2b3;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#98a2b3"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#fbfcfe"/>
  <text x="70" y="68" class="title">托管执行迁移：旧架构与 1.17.1 目标架构</text>
  <text x="70" y="102" class="sub">核心不是重写调度中心，而是重新建立“公司调度层 ↔ Dify 官方 Runtime”的执行边界</text>

  <rect x="70" y="145" rx="24" width="680" height="650" fill="#fff8f6" stroke="#f7b4a7" stroke-width="2"/>
  <text x="105" y="188" class="h">1.14.x 旧实现：公司 Worker 深度进入 Runtime</text>

  <rect x="120" y="220" rx="14" width="580" height="60" fill="#fff" stroke="#d0d5dd" stroke-width="2"/>
  <text x="410" y="257" text-anchor="middle" class="t">API / WebApp / Console</text>
  <path d="M410 280 L410 315" class="arrow"/>

  <rect x="120" y="320" rx="14" width="580" height="78" fill="#fff" stroke="#f0a08e" stroke-width="2"/>
  <text x="410" y="350" text-anchor="middle" class="t">公司 Controller / Adapter / Admission</text>
  <text x="410" y="376" text-anchor="middle" class="s">路由判断 + Policy + Job + 输入快照</text>
  <path d="M410 398 L410 433" class="arrow"/>

  <rect x="120" y="438" rx="14" width="580" height="78" fill="#fff" stroke="#f0a08e" stroke-width="2"/>
  <text x="410" y="468" text-anchor="middle" class="t">公司 Scheduler → Standard / Critical Queue</text>
  <text x="410" y="494" text-anchor="middle" class="s">优先级、Lease、Outbox、容量</text>
  <path d="M410 516 L410 551" class="arrow"/>

  <rect x="120" y="556" rx="14" width="580" height="92" fill="#fff0ed" stroke="#e66c4f" stroke-width="3"/>
  <text x="410" y="588" text-anchor="middle" class="t">公司 Managed Worker</text>
  <text x="410" y="615" text-anchor="middle" class="s">直接调用旧 Workflow / Chat / Agent Generator</text>
  <rect x="590" y="570" rx="10" width="82" height="28" fill="#fee4e2"/>
  <text x="631" y="590" text-anchor="middle" class="badge" fill="#b42318">高耦合</text>
  <path d="M410 648 L410 683" class="arrow"/>

  <rect x="120" y="688" rx="14" width="580" height="76" fill="#fff" stroke="#f0a08e" stroke-width="2"/>
  <text x="410" y="718" text-anchor="middle" class="t">公司自行处理事件、暂停、结果和状态</text>
  <text x="410" y="744" text-anchor="middle" class="s">Streaming / Blocking / Stop / Retry / Human Input</text>

  <rect x="850" y="145" rx="24" width="680" height="650" fill="#f5fbf8" stroke="#9dd9b7" stroke-width="2"/>
  <text x="885" y="188" class="h">1.17.1 目标：公司管调度，Dify 管执行</text>

  <rect x="900" y="220" rx="14" width="580" height="60" fill="#fff" stroke="#d0d5dd" stroke-width="2"/>
  <text x="1190" y="257" text-anchor="middle" class="t">1.17.1 API / WebApp / Console</text>
  <path d="M1190 280 L1190 315" class="arrow"/>

  <rect x="900" y="320" rx="14" width="580" height="78" fill="#eef4ff" stroke="#84adff" stroke-width="2"/>
  <text x="1190" y="350" text-anchor="middle" class="t">公司 Admission / Policy / Job / Queue</text>
  <text x="1190" y="376" text-anchor="middle" class="s">保留优先级、准入、任务中心和输入快照</text>
  <path d="M1190 398 L1190 433" class="arrow"/>

  <rect x="900" y="438" rx="14" width="580" height="78" fill="#eef4ff" stroke="#84adff" stroke-width="2"/>
  <text x="1190" y="468" text-anchor="middle" class="t">公司 Scheduler → Standard / Critical Queue</text>
  <text x="1190" y="494" text-anchor="middle" class="s">保留 Lease、Outbox、容量和资源隔离</text>
  <path d="M1190 516 L1190 551" class="arrow"/>

  <rect x="900" y="556" rx="14" width="580" height="92" fill="#fff7ed" stroke="#f7b955" stroke-width="3"/>
  <text x="1190" y="588" text-anchor="middle" class="t">Managed Worker 执行入口重写</text>
  <text x="1190" y="615" text-anchor="middle" class="s">把公司 Job 转成 1.17.1 官方执行参数 / Execution Task</text>
  <rect x="1370" y="570" rx="10" width="82" height="28" fill="#fef0c7"/>
  <text x="1411" y="590" text-anchor="middle" class="badge" fill="#b54708">重写点</text>
  <path d="M1190 648 L1190 683" class="arrow"/>

  <rect x="900" y="688" rx="14" width="580" height="76" fill="#ecfdf3" stroke="#6ce9a6" stroke-width="2"/>
  <text x="1190" y="718" text-anchor="middle" class="t">1.17.1 官方 Runtime</text>
  <text x="1190" y="744" text-anchor="middle" class="s">WorkflowRun / Message / Human Input / SSE / Generator</text>

  <rect x="345" y="820" rx="18" width="910" height="52" fill="#f2f4f7" stroke="#d0d5dd"/>
  <text x="800" y="852" text-anchor="middle" class="t">迁移重点：保留公司调度能力，重做 Worker → Runtime、ID / 状态映射和结果交付</text>
</svg>