<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#172033}
.t{font-size:32px;font-weight:700}.s{font-size:16px;fill:#667085}.h{font-size:20px;font-weight:700}.n{font-size:15px;font-weight:700}.m{font-size:13px;fill:#667085}
.line{stroke:#667085;stroke-width:2.5;fill:none;marker-end:url(#a)}
</style>
<filter id="sh"><feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#24324a" flood-opacity=".15"/></filter>
<marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L9 5 0 10Z" fill="#667085"/></marker>
<linearGradient id="p" x1="0" x2="1"><stop stop-color="#eee6ff"/><stop offset="1" stop-color="#d7c7ff"/></linearGradient>
<linearGradient id="b" x1="0" x2="1"><stop stop-color="#dfedff"/><stop offset="1" stop-color="#bad6ff"/></linearGradient>
<linearGradient id="o" x1="0" x2="1"><stop stop-color="#fff0d6"/><stop offset="1" stop-color="#ffd18b"/></linearGradient>
<linearGradient id="r" x1="0" x2="1"><stop stop-color="#ffe8e2"/><stop offset="1" stop-color="#ffb9a8"/></linearGradient>
<linearGradient id="g" x1="0" x2="1"><stop stop-color="#dcf7e9"/><stop offset="1" stop-color="#b8e8cf"/></linearGradient>
</defs>
<rect width="1600" height="900" fill="#f8fafc"/>
<text x="70" y="60" class="t">高工作量迁移分布</text>
<text x="70" y="92" class="s">重活主要集中在执行适配、状态映射和特殊执行链路</text>

