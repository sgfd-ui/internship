<g filter="url(#sh)">
<polygon points="665,590 800,562 935,590 800,620" fill="url(#o)" stroke="#dd9d36" stroke-width="2"/>
<polygon points="665,590 800,620 800,655 665,626" fill="#f5c56d"/>
