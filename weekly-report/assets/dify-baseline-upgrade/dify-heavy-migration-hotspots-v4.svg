<g transform="translate(385 725)"><circle r="29" fill="#fff" stroke="#5f95d8" stroke-width="2.4"/><path d="M0-12V12M-12 0H12" stroke="#5f95d8" stroke-width="3" stroke-linecap="round"/></g>
<text x="385" y="795" text-anchor="middle" class="n">Human Input</text>
<g transform="translate(560 725)"><circle r="29" fill="#fff" stroke="#5f95d8" stroke-width="2.4"/><path d="M0-15V2L12 10" fill="none" stroke="#5f95d8" stroke-width="3" stroke-linecap="round"/></g>
