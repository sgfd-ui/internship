<g transform="translate(190 257)"><circle r="21" fill="#fff" stroke="#8d72c4" stroke-width="2.5"/><path d="M0-11V2L10 8" fill="none" stroke="#8d72c4" stroke-width="3" stroke-linecap="round"/></g>
<g transform="translate(250 257)"><ellipse cy="-6" rx="19" ry="6" fill="#fff" stroke="#8d72c4" stroke-width="2"/><rect x="-19" y="-6" width="38" height="18" fill="#f4efff" stroke="#8d72c4" stroke-width="2"/><ellipse cy="12" rx="19" ry="6" fill="#eadfff" stroke="#8d72c4" stroke-width="2"/></g>

