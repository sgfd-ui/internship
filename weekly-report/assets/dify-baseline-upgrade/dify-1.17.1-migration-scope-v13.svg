<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1130" viewBox="0 0 1600 1130">
  <defs>
    <style>
      .t{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;fill:#172033}
      .title{font-size:31px;font-weight:700}
      .sub{font-size:15px;fill:#667085}
      .h{font-size:20px;font-weight:700}
      .label{font-size:16px;font-weight:600}
      .small{font-size:13px;fill:#667085}
      .tiny{font-size:12px;fill:#667085}
      .panel{fill:#fff;stroke:#e4e7ec;stroke-width:1.4}
      .blue{fill:#eef4ff;stroke:#b2ccff;stroke-width:1.3}
      .green{fill:#ecfdf3;stroke:#abefc6;stroke-width:1.3}
      .purple{fill:#f4f3ff;stroke:#c7c3ff;stroke-width:1.3}
      .amber{fill:#fffaeb;stroke:#fedf89;stroke-width:1.3}
      .gray{fill:#f8fafc;stroke:#d0d5dd;stroke-width:1.3}
      .dash{stroke-dasharray:8 7}
      .line{stroke:#98a2b3;stroke-width:2.2;fill:none}
      .bline{stroke:#6172f3;stroke-width:2.5;fill:none}
      .pline{stroke:#7f56d9;stroke-width:2.5;fill:none}
      .gline{stroke:#17b26a;stroke-width:2.5;fill:none}
      .icon{fill:none;stroke:#475467;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#98a2b3"/></marker>
    <marker id="arrowB" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6172f3"/></marker>
    <marker id="arrowP" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7f56d9"/></marker>
    <marker id="arrowG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#17b26a"/></marker>
    <symbol id="server" viewBox="0 0 32 32"><rect x="4" y="4" width="24" height="9" rx="2" class="icon"/><rect x="4" y="19" width="24" height="9" rx="2" class="icon"/><path d="M9 8h.1M9 23h.1M14 8h9M14 23h9" class="icon"/></symbol>
    <symbol id="users" viewBox="0 0 32 32"><circle cx="12" cy="11" r="4" class="icon"/><circle cx="22" cy="12" r="3" class="icon"/><path d="M4 26c.8-5 4-8 8-8s7.2 3 8 8M19 20c3.6.1 6 2.2 7 6" class="icon"/></symbol>
    <symbol id="lock" viewBox="0 0 32 32"><rect x="6" y="13" width="20" height="15" rx="3" class="icon"/><path d="M10 13V9a6 6 0 0 1 12 0v4M16 19v4" class="icon"/></symbol>
    <symbol id="queue" viewBox="0 0 32 32"><path d="M5 8h16M5 16h22M5 24h12" class="icon"/><circle cx="25" cy="8" r="2" class="icon"/><circle cx="21" cy="24" r="2" class="icon"/></symbol>
    <symbol id="network" viewBox="0 0 32 32"><circle cx="7" cy="16" r="3" class="icon"/><circle cx="25" cy="7" r="3" class="icon"/><circle cx="25" cy="25" r="3" class="icon"/><path d="M10 15 22 8M10 17l12 7" class="icon"/></symbol>
    <symbol id="spark" viewBox="0 0 32 32"><path d="M16 3l2.8 8.2L27 14l-8.2 2.8L16 25l-2.8-8.2L5 14l8.2-2.8z" class="icon"/><path d="M25 3v6M22 6h6" class="icon"/></symbol>
    <symbol id="check" viewBox="0 0 32 32"><circle cx="16" cy="16" r="12" class="icon"/><path d="m10 16 4 4 8-9" class="icon"/></symbol>
  </defs>

  <rect width="1600" height="1130" fill="#fff"/>
  <text x="800" y="48" text-anchor="middle" class="t title">Dify 1.17.1 基线升级：三阶段迁移路径</text>
  <text x="800" y="77" text-anchor="middle" class="t sub">先完成现有能力迁移形成稳定基线，再升级新版能力，最后评审执行调度是否迁移、重写或取消</text>

  <!-- main timeline -->
  <g>
    <rect x="65" y="120" width="205" height="88" rx="18" class="gray"/>
    <text x="168" y="151" text-anchor="middle" class="t label">当前状态</text>
    <text x="168" y="178" text-anchor="middle" class="t h">Dify 1.14.2</text>
    <text x="168" y="197" text-anchor="middle" class="t tiny">官方基线 + 公司扩展</text>

    <path d="M280 164 H340" class="bline" marker-end="url(#arrowB)"/>

    <rect x="350" y="105" width="235" height="118" rx="20" class="blue"/>
    <text x="468" y="135" text-anchor="middle" class="t small">阶段一</text>
    <text x="468" y="163" text-anchor="middle" class="t h">现有能力迁移</text>
    <text x="468" y="190" text-anchor="middle" class="t tiny">先保证当前业务在 1.17.1 可运行</text>

    <path d="M595 164 H655" class="bline" marker-end="url(#arrowB)"/>

    <rect x="665" y="120" width="210" height="88" rx="18" class="green"/>
    <text x="770" y="151" text-anchor="middle" class="t label">阶段一产出</text>
    <text x="770" y="178" text-anchor="middle" class="t h">1.17.1 稳定基线</text>
    <text x="770" y="197" text-anchor="middle" class="t tiny">现有功能通过回归</text>

    <path d="M885 164 H945" class="pline" marker-end="url(#arrowP)"/>

    <rect x="955" y="105" width="235" height="118" rx="20" class="purple"/>
    <text x="1073" y="135" text-anchor="middle" class="t small">阶段二</text>
    <text x="1073" y="163" text-anchor="middle" class="t h">1.17.1 新能力升级</text>
    <text x="1073" y="190" text-anchor="middle" class="t tiny">按业务价值选择性启用</text>

    <path d="M1200 164 H1260" class="line" marker-end="url(#arrow)"/>

    <rect x="1270" y="105" width="265" height="118" rx="20" class="amber dash"/>
    <text x="1403" y="135" text-anchor="middle" class="t small">阶段三</text>
    <text x="1403" y="163" text-anchor="middle" class="t h">执行调度能力评审</text>
    <text x="1403" y="190" text-anchor="middle" class="t tiny">迁移 / 重写 / 取消</text>
  </g>

  <!-- stage details -->
  <rect x="65" y="270" width="470" height="650" rx="22" class="panel"/>
  <rect x="565" y="270" width="470" height="650" rx="22" class="panel"/>
  <rect x="1065" y="270" width="470" height="650" rx="22" class="panel"/>

  <rect x="65" y="270" width="470" height="66" rx="22" class="blue"/>
  <text x="95" y="297" class="t small">阶段一</text>
  <text x="95" y="321" class="t h">迁移当前必须保留的 1.14.2 能力</text>

  <g transform="translate(100,370)"><use href="#server" width="36" height="36"/><text x="50" y="16" class="t label">平台构建与部署</text><text x="50" y="38" class="t small">API / Web 制品、启动参数、环境配置</text></g>
  <line x1="100" y1="430" x2="500" y2="430" stroke="#eaecf0"/>
  <g transform="translate(100,458)"><use href="#users" width="36" height="36"/><text x="50" y="16" class="t label">账号与工作空间</text><text x="50" y="38" class="t small">SkyOA、管理员、邀请、默认空间、Workspace</text></g>
  <line x1="100" y1="520" x2="500" y2="520" stroke="#eaecf0"/>
  <g transform="translate(100,548)"><use href="#lock" width="36" height="36"/><text x="50" y="16" class="t label">存储与数据安全</text><text x="50" y="38" class="t small">S3 / KMS、文件路径、租户私钥</text></g>
  <line x1="100" y1="610" x2="500" y2="610" stroke="#eaecf0"/>
  <g transform="translate(100,638)"><use href="#network" width="36" height="36"/><text x="50" y="16" class="t label">运行环境适配</text><text x="50" y="38" class="t small">PostgreSQL、Redis、Celery、Event Bus、Socket.IO、SSE</text></g>

  <rect x="100" y="735" width="400" height="118" rx="18" class="green"/>
  <g transform="translate(126,760)"><use href="#check" width="34" height="34"/><text x="48" y="17" class="t label">阶段一完成条件</text></g>
  <text x="126" y="810" class="t small">• 现有六个运行应用完成 1.17.1 回归</text>
  <text x="126" y="834" class="t small">• 账号、Workspace、Redis、S3/KMS 和历史数据可用</text>

  <rect x="565" y="270" width="470" height="66" rx="22" class="purple"/>
  <text x="595" y="297" class="t small">阶段二</text>
  <text x="595" y="321" class="t h">基于稳定基线升级 1.17.1 新能力</text>

  <g transform="translate(600,370)"><use href="#spark" width="36" height="36"/><text x="50" y="16" class="t label">新 Agent 能力</text><text x="50" y="38" class="t small">Agent App / Skills / DSL / Snapshot</text></g>
  <line x1="600" y1="430" x2="1000" y2="430" stroke="#eaecf0"/>
  <g transform="translate(600,458)"><use href="#server" width="36" height="36"/><text x="50" y="16" class="t label">Agent Runtime</text><text x="50" y="38" class="t small">Agent Backend / Local Sandbox / SSRF Proxy</text></g>
  <line x1="600" y1="520" x2="1000" y2="520" stroke="#eaecf0"/>
  <g transform="translate(600,548)"><use href="#spark" width="36" height="36"/><text x="50" y="16" class="t label">Workflow / Human Input / Tracing</text><text x="50" y="38" class="t small">按实际业务价值选择性开放新版能力</text></g>

  <rect x="600" y="650" width="400" height="203" rx="18" class="purple"/>
  <text x="626" y="681" class="t label">阶段二原则</text>
  <text x="626" y="714" class="t small">1. 不作为阶段一上线阻塞项</text>
  <text x="626" y="742" class="t small">2. 需要新增组件时单独验证依赖与部署方式</text>
  <text x="626" y="770" class="t small">3. 不因为官方新增能力而自动扩大公司定制范围</text>
  <text x="626" y="814" class="t tiny">输出：确定哪些 1.17.1 新能力真正进入公司平台</text>

  <rect x="1065" y="270" width="470" height="66" rx="22" class="amber dash"/>
  <text x="1095" y="297" class="t small">阶段三</text>
  <text x="1095" y="321" class="t h">执行调度能力独立评审</text>

  <g transform="translate(1100,370)"><use href="#queue" width="36" height="36"/><text x="50" y="16" class="t label">准入与调度</text><text x="50" y="38" class="t small">Policy / Admission / Priority / Job / Scheduler / Lease</text></g>
  <line x1="1100" y1="430" x2="1500" y2="430" stroke="#eaecf0"/>
  <g transform="translate(1100,458)"><use href="#server" width="36" height="36"/><text x="50" y="16" class="t label">专用执行资源</text><text x="50" y="38" class="t small">Standard / Critical Worker</text></g>
  <line x1="1100" y1="520" x2="1500" y2="520" stroke="#eaecf0"/>
  <g transform="translate(1100,548)"><use href="#users" width="36" height="36"/><text x="50" y="16" class="t label">执行与治理</text><text x="50" y="38" class="t small">正式应用、Console、Human Input、Schedule、任务中心</text></g>

  <rect x="1100" y="650" width="400" height="203" rx="18" class="gray dash"/>
  <text x="1126" y="681" class="t label">评审顺序</text>
  <text x="1126" y="714" class="t small">1. 旧能力是否仍有业务必要性</text>
  <text x="1126" y="742" class="t small">2. 1.17.1 官方能力是否已经覆盖</text>
  <text x="1126" y="770" class="t small">3. 若保留，再比较直接迁移与围绕新版重写</text>
  <text x="1126" y="814" class="t tiny">输出：迁移 / 重写 / 取消，以及对应工作量</text>

  <path d="M300 940 H800" class="bline" marker-end="url(#arrowB)"/>
  <path d="M800 940 H1300" class="pline" marker-end="url(#arrowP)"/>
  <text x="800" y="972" text-anchor="middle" class="t small">阶段一 → 阶段二 → 阶段三</text>

  <path d="M1300 985 V1030 H800" class="line" marker-end="url(#arrow)"/>
  <rect x="555" y="1028" width="490" height="72" rx="18" class="green"/>
  <text x="800" y="1055" text-anchor="middle" class="t small">三阶段完成后</text>
  <text x="800" y="1082" text-anchor="middle" class="t h">最终收束与正式迁移</text>
  <text x="800" y="1100" text-anchor="middle" class="t tiny">分支 / 流水线 / 部署收束 · 数据迁移 · 正式切换 · 回滚</text>
</svg>